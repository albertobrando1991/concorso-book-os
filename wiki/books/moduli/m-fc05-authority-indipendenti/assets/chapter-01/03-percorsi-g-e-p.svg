<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tre percorsi, una base comune</title>
  <desc id="desc">G, E e P cambiano priorità, linguaggio e tipo di allenamento.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; } .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; } .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; } .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; } .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: Arial, Helvetica, sans-serif; } .muted { fill: #526174; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 43px; font-weight: 700; } .subtitle { font-size: 22px; } .label { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 20px; } .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .navy { fill: #10233F; } .bordeaux { fill: #7A2430; } .gold { fill: #D4AF37; } .green { fill: #2F7D5A; } .teal { fill: #1F6F78; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; } .thin { stroke: #CBD5E1; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); } .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7A2430"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="ink title" x="800" y="70" text-anchor="middle">Tre percorsi, una base comune</text>
  <text class="muted subtitle" x="800" y="112" text-anchor="middle">G, E e P cambiano priorità, linguaggio e tipo di allenamento.</text>
  
  <rect class="softGold" x="315" y="175" width="970" height="105" rx="26"/>
  <text class="gold label" x="800" y="220" text-anchor="middle">Base comune: bando, fonti, procedimento, dati, prova e diario degli errori</text>
  <text class="muted small" x="800" y="254" text-anchor="middle">Il profilo ordina le priorità: non autorizza a ignorare le garanzie comuni.</text>
  <g data-safe-box="100 335 390 420 8"><rect class="card" x="100" y="335" width="390" height="420" rx="28"/><rect x="100" y="335" width="390" height="14" rx="7" fill="#10233F"/><text class="navy label" x="295" y="398" text-anchor="middle">G — Giuridico</text><rect class="softBlue" x="138" y="450" width="314" height="54" rx="16"/><text class="muted small" x="295" y="484" text-anchor="middle">fonti e poteri</text><rect class="softBlue" x="138" y="525" width="314" height="54" rx="16"/><text class="muted small" x="295" y="559" text-anchor="middle">procedimento</text><rect class="softBlue" x="138" y="600" width="314" height="54" rx="16"/><text class="muted small" x="295" y="634" text-anchor="middle">garanzie e rimedi</text><path class="thin" d="M135 684 L455 684"/><text class="muted small" x="295" y="720" text-anchor="middle" style="font-size:16px">Rischio: elenco di norme senza sequenza.</text></g>
<g data-safe-box="555 335 390 420 8"><rect class="card" x="555" y="335" width="390" height="420" rx="28"/><rect x="555" y="335" width="390" height="14" rx="7" fill="#2F7D5A"/><text class="green label" x="750" y="398" text-anchor="middle">E — Economico-regolatorio</text><rect class="softGreen" x="593" y="450" width="314" height="54" rx="16"/><text class="muted small" x="750" y="484" text-anchor="middle">mercati e incentivi</text><rect class="softGreen" x="593" y="525" width="314" height="54" rx="16"/><text class="muted small" x="750" y="559" text-anchor="middle">tariffe e qualità</text><rect class="softGreen" x="593" y="600" width="314" height="54" rx="16"/><text class="muted small" x="750" y="634" text-anchor="middle">dati e consultazione</text><path class="thin" d="M590 684 L910 684"/><text class="muted small" x="750" y="720" text-anchor="middle" style="font-size:16px">Rischio: formule senza problema regolatorio.</text></g>
<g data-safe-box="1010 335 390 420 8"><rect class="card" x="1010" y="335" width="390" height="420" rx="28"/><rect x="1010" y="335" width="390" height="14" rx="7" fill="#7A2430"/><text class="bordeaux label" x="1205" y="398" text-anchor="middle">P — Giuridico-economico</text><rect class="softRed" x="1048" y="450" width="314" height="54" rx="16"/><text class="muted small" x="1205" y="484" text-anchor="middle">norma e mercato</text><rect class="softRed" x="1048" y="525" width="314" height="54" rx="16"/><text class="muted small" x="1205" y="559" text-anchor="middle">dato e decisione</text><rect class="softRed" x="1048" y="600" width="314" height="54" rx="16"/><text class="muted small" x="1205" y="634" text-anchor="middle">memo tecnico</text><path class="thin" d="M1045 684 L1365 684"/><text class="muted small" x="1205" y="720" text-anchor="middle" style="font-size:16px">Rischio: accumulare tutti i settori.</text></g>
  <g data-safe-box="230 850 1140 70 8"><rect class="note" x="230" y="850" width="1140" height="70" rx="24"/><text class="ink body" x="800" y="894" text-anchor="middle" style="font-weight:700;font-size:20px">Scegli il percorso dal programma e dall'output di prova, non dal nome più attraente dell'ente.</text></g>

</svg>