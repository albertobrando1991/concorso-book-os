<g data-safe-box="1295 290 240 145 8"><rect class="softTeal" x="1295" y="290" width="240" height="145" rx="22"/><rect x="1295" y="290" width="240" height="10" rx="5" fill="#1F6F78"/><text class="teal label" x="1415" y="340" text-anchor="middle" style="font-size:22px">Rischio</text><path class="thin" d="M1317 362 L1513 362"/><text class="muted small" x="1415" y="398" text-anchor="middle" style="font-size:16px">confusione, fonte, tempo</text><path class="thin" d="M1323 413 L1507 413"/></g>
<g data-safe-box="260 555 310 145 8"><rect class="softBlue" x="260" y="555" width="310" height="145" rx="22"/><rect x="260" y="555" width="310" height="10" rx="5" fill="#10233F"/><text class="navy label" x="415" y="605" text-anchor="middle" style="font-size:22px">Materie base</text><path class="thin" d="M282 627 L548 627"/><text class="muted small" x="415" y="663" text-anchor="middle" style="font-size:16px">rinvio puntuale a VOL-01</text><path class="thin" d="M288 678 L542 678"/></g>
<g data-safe-box="660 555 310 145 8"><rect class="softRed" x="660" y="555" width="310" height="145" rx="22"/><rect x="660" y="555" width="310" height="10" rx="5" fill="#7A2430"/><text class="bordeaux label" x="815" y="605" text-anchor="middle" style="font-size:19px">Delta specialistico</text><path class="thin" d="M682 627 L948 627"/><text class="muted small" x="815" y="663" text-anchor="middle" style="font-size:16px">capitolo M-FC05 prioritario</text><path class="thin" d="M688 678 L942 678"/></g>
<g data-safe-box="1060 555 310 145 8"><rect class="softGreen" x="1060" y="555" width="310" height="145" rx="22"/><rect x="1060" y="555" width="310" height="10" rx="5" fill="#2F7D5A"/><text class="green label" x="1215" y="605" text-anchor="middle" style="font-size:22px">Output</text><path class="thin" d="M1082 627 L1348 627"/><text class="muted small" x="1215" y="663" text-anchor="middle" style="font-size:16px">risposta, schema, esercizio</text><path class="thin" d="M1088 678 L1342 678"/></g>
  <g data-safe-box="230 850 1140 70 8"><rect class="note" x="230" y="850" width="1140" height="70" rx="24"/><text class="ink body" x="800" y="894" text-anchor="middle" style="font-weight:700;font-size:18px">Il bando guida il materiale: ogni campo vuoto segnala una verifica da fare prima di programmare lo studio.</text></g>

