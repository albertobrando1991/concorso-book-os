<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Distinzioni essenziali: Economia della regolazione</title><desc id="desc">Tre confronti che impediscono errori di qualificazione e di metodo.</desc><defs><style>.bg{fill:#F8FAFC}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:3}.softBlue{fill:#EAF2FB;stroke:#B9CBE0;stroke-width:2.5}.softRed{fill:#F8E8EA;stroke:#E3B9BF;stroke-width:2.5}.softGold{fill:#FFF4CC;stroke:#E8D080;stroke-width:2.5}.softGreen{fill:#E7F3ED;stroke:#A8D1BD;stroke-width:2.5}.softTeal{fill:#E4F4F5;stroke:#A3D5D8;stroke-width:2.5}.note{fill:#FFF7ED;stroke:#E7C18E;stroke-width:2.5}.ink{fill:#0F172A;font-family:Arial,Helvetica,sans-serif}.muted{fill:#526174;font-family:Arial,Helvetica,sans-serif}.title{font-size:43px;font-weight:700}.subtitle{font-size:22px}.label{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700}.body{font-family:Arial,Helvetica,sans-serif;font-size:20px}.small{font-family:Arial,Helvetica,sans-serif;font-size:18px}.navy{fill:#10233F}.bordeaux{fill:#7A2430}.gold{fill:#D4AF37}.green{fill:#2F7D5A}.teal{fill:#1F6F78}.line{stroke:#94A3B8;stroke-width:4;stroke-linecap:round;fill:none}.thin{stroke:#CBD5E1;stroke-width:2.5;stroke-linecap:round;fill:none}.arrowNavy{stroke:#10233F;stroke-width:5;stroke-linecap:round;fill:none;marker-end:url(#arrowNavy)}</style><marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect class="bg" width="1600" height="1000"/><text class="ink title" x="800" y="70" text-anchor="middle">Distinzioni essenziali: Economia della regolazione</text><text class="muted subtitle" x="800" y="112" text-anchor="middle">Tre confronti che impediscono errori di qualificazione e di metodo.</text>
  <g data-safe-box="150 270 350 350 8"><rect class="card" x="150" y="270" width="350" height="350" rx="28"/><circle cx="325" cy="345" r="42" fill="#10233F"/><text class="label" x="325" y="354" text-anchor="middle" fill="#FFFFFF">1</text><text class="navy label" x="325" y="445" text-anchor="middle" style="font-size:21px">costo non è prezzo</text><path class="thin" d="M192 485 L458 485"/><text class="muted small" x="325" y="530" text-anchor="middle">definisci, distingui, applica</text></g>
<g data-safe-box="625 270 350 350 8"><rect class="card" x="625" y="270" width="350" height="350" rx="28"/><circle cx="800" cy="345" r="42" fill="#7A2430"/><text class="label" x="800" y="354" text-anchor="middle" fill="#FFFFFF">2</text><text class="bordeaux label" x="800" y="445" text-anchor="middle" style="font-size:18px">correlazione non è causalità</text><path class="thin" d="M667 485 L933 485"/><text class="muted small" x="800" y="530" text-anchor="middle">definisci, distingui, applica</text></g>
<g data-safe-box="1100 270 350 350 8"><rect class="card" x="1100" y="270" width="350" height="350" rx="28"/><circle cx="1275" cy="345" r="42" fill="#2F7D5A"/><text class="label" x="1275" y="354" text-anchor="middle" fill="#FFFFFF">3</text><text class="green label" x="1275" y="445" text-anchor="middle" style="font-size:18px">tariffa non è numero isolato</text><path class="thin" d="M1142 485 L1408 485"/><text class="muted small" x="1275" y="530" text-anchor="middle">definisci, distingui, applica</text></g>
  <g data-safe-box="220 850 1160 70 8"><rect class="note" x="220" y="850" width="1160" height="70" rx="24"/><text class="ink body" x="800" y="894" text-anchor="middle" style="font-weight:700;font-size:18px">Se non sai spiegare la differenza, non puoi ancora scegliere il potere, il procedimento o l'output corretto.</text></g></svg>