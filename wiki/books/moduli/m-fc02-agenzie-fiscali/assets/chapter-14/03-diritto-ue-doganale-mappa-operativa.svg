<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Diritto UE doganale: mappa operativa</title>
  <desc id="desc">Cornice UE, Codice doganale, ADM, merce, triade tecnica e controlli.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Diritto UE doganale: mappa operativa</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Cornice UE, Codice doganale, ADM, merce, triade tecnica e controlli.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="135 255 300 138 12" data-safe-name="Unione europea">
    <rect class="softBlue" x="135" y="255" width="300" height="138" rx="26"/>
    <circle cx="179" cy="299" r="18" fill="#10233F"/>
    <text class="ink label" x="209" y="307">Unione europea</text>
    <text class="muted body" x="169" y="347">cornice comune</text>
<text class="muted body" x="169" y="375">regole doganali</text>
  </g>
  <g data-safe-box="500 255 300 138 12" data-safe-name="CDU">
    <rect class="softRed" x="500" y="255" width="300" height="138" rx="26"/>
    <circle cx="544" cy="299" r="18" fill="#7A2430"/>
    <text class="ink label" x="574" y="307">CDU</text>
    <text class="muted body" x="534" y="347">regimi</text>
<text class="muted body" x="534" y="375">dichiarazione</text>
  </g>
  <g data-safe-box="865 255 300 138 12" data-safe-name="ADM">
    <rect class="softGreen" x="865" y="255" width="300" height="138" rx="26"/>
    <circle cx="909" cy="299" r="18" fill="#2F7D5A"/>
    <text class="ink label" x="939" y="307">ADM</text>
    <text class="muted body" x="899" y="347">applica</text>
<text class="muted body" x="899" y="375">controlla</text>
  </g>
  <g data-safe-box="1230 255 235 138 12" data-safe-name="Caso">
    <rect class="softTeal" x="1230" y="255" width="235" height="138" rx="26"/>
    <circle cx="1274" cy="299" r="18" fill="#1F6F78"/>
    <text class="ink label" x="1304" y="307">Caso</text>
    <text class="muted body" x="1264" y="347">merce</text>
<text class="muted body" x="1264" y="375">operatore</text>
  </g>
  <path class="arrowNavy" d="M445 324 L490 324"/>
  <path class="arrowBordeaux" d="M810 324 L855 324"/>
  <path class="arrowGreen" d="M1175 324 L1220 324"/>
  <g data-safe-box="155 505 300 118 8" data-safe-name="Dichiarazione">
    <rect class="softBlue" x="155" y="505" width="300" height="118" rx="20"/>
    <rect x="155" y="505" width="10" height="118" rx="5" fill="#10233F"/>
    <text class="ink label" x="179" y="541">Dichiarazione</text>
    <text class="muted small" x="179" y="573">regime e dati</text>
<text class="muted small" x="179" y="596">documenti</text>
  </g>
  <g data-safe-box="520 505 300 118 8" data-safe-name="Triade tecnica">
    <rect class="softGold" x="520" y="505" width="300" height="118" rx="20"/>
    <rect x="520" y="505" width="10" height="118" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="544" y="541">Triade tecnica</text>
    <text class="muted small" x="544" y="573">classificazione</text>
<text class="muted small" x="544" y="596">origine, valore</text>
  </g>
  <g data-safe-box="885 505 300 118 8" data-safe-name="Controlli">
    <rect class="softRed" x="885" y="505" width="300" height="118" rx="20"/>
    <rect x="885" y="505" width="10" height="118" rx="5" fill="#7A2430"/>
    <text class="ink label" x="909" y="541">Controlli</text>
    <text class="muted small" x="909" y="573">rischio</text>
<text class="muted small" x="909" y="596">documenti/merce</text>
  </g>
  <g data-safe-box="1250 505 235 118 8" data-safe-name="AEO/EORI">
    <rect class="softTeal" x="1250" y="505" width="235" height="118" rx="20"/>
    <rect x="1250" y="505" width="10" height="118" rx="5" fill="#1F6F78"/>
    <text class="ink label" x="1274" y="541">AEO/EORI</text>
    <text class="muted small" x="1274" y="573">operatore</text>
<text class="muted small" x="1274" y="596">affidabilita</text>
  </g>
  <path class="line" d="M800 395 L800 452"/>
  <path class="line" d="M305 452 L1370 452"/>
  <path class="line" d="M305 452 L305 505"/>
  <path class="line" d="M670 452 L670 505"/>
  <path class="line" d="M1035 452 L1035 505"/>
  <path class="line" d="M1370 452 L1370 505"/>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Nel profilo ADM il diritto UE non e' teoria generale: serve a qualificare la merce e il controllo.</text>
  </g>

</svg>
