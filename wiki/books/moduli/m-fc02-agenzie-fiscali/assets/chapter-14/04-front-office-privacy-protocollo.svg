<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Front-office e protezione dati</title>
  <desc id="desc">Sette passaggi per orientare senza promettere e trattare solo dati necessari.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Front-office e protezione dati</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Sette passaggi per orientare senza promettere e trattare solo dati necessari.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="110 235 265 138 8" data-safe-name="Ascolta">
    <rect class="softBlue" x="110" y="235" width="265" height="138" rx="22"/>
    <circle cx="146" cy="271" r="20" fill="#10233F"/>
    <text x="146" y="279" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="178" y="279">Ascolta</text>
    <text class="muted small" x="138" y="319">richiesta</text>
<text class="muted small" x="138" y="342">urgenza</text>
  </g>
  <g data-safe-box="455 235 265 138 8" data-safe-name="Identifica">
    <rect class="softRed" x="455" y="235" width="265" height="138" rx="22"/>
    <circle cx="491" cy="271" r="20" fill="#7A2430"/>
    <text x="491" y="279" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="523" y="279">Identifica</text>
    <text class="muted small" x="483" y="319">soggetto</text>
<text class="muted small" x="483" y="342">legittimazione</text>
  </g>
  <g data-safe-box="800 235 265 138 8" data-safe-name="Qualifica">
    <rect class="softGold" x="800" y="235" width="265" height="138" rx="22"/>
    <circle cx="836" cy="271" r="20" fill="#D4AF37"/>
    <text x="836" y="279" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="868" y="279">Qualifica</text>
    <text class="muted small" x="828" y="319">AE, ADM</text>
<text class="muted small" x="828" y="342">AdER o altro</text>
  </g>
  <g data-safe-box="1145 235 265 138 8" data-safe-name="Verifica atto">
    <rect class="softGreen" x="1145" y="235" width="265" height="138" rx="22"/>
    <circle cx="1181" cy="271" r="20" fill="#2F7D5A"/>
    <text x="1181" y="279" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="1213" y="279">Verifica atto</text>
    <text class="muted small" x="1173" y="319">documento</text>
<text class="muted small" x="1173" y="342">canale</text>
  </g>
  <path class="arrowNavy" d="M375 305 L445 305"/>
  <path class="arrowBordeaux" d="M720 305 L790 305"/>
  <path class="arrowGold" d="M1065 305 L1135 305"/>
  <g data-safe-box="270 525 265 138 8" data-safe-name="Proteggi dati">
    <rect class="softTeal" x="270" y="525" width="265" height="138" rx="22"/>
    <circle cx="306" cy="561" r="20" fill="#1F6F78"/>
    <text x="306" y="569" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">5</text>
    <text class="ink label" x="338" y="569">Proteggi dati</text>
    <text class="muted small" x="298" y="609">base, canale</text>
<text class="muted small" x="298" y="632">minimizzazione</text>
  </g>
  <g data-safe-box="655 525 265 138 8" data-safe-name="Orienta">
    <rect class="softBlue" x="655" y="525" width="265" height="138" rx="22"/>
    <circle cx="691" cy="561" r="20" fill="#10233F"/>
    <text x="691" y="569" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">6</text>
    <text class="ink label" x="723" y="569">Orienta</text>
    <text class="muted small" x="683" y="609">termini</text>
<text class="muted small" x="683" y="632">documenti</text>
  </g>
  <g data-safe-box="1040 525 265 138 8" data-safe-name="Chiudi">
    <rect class="softRed" x="1040" y="525" width="265" height="138" rx="22"/>
    <circle cx="1076" cy="561" r="20" fill="#7A2430"/>
    <text x="1076" y="569" text-anchor="middle" fill="#FFFFFF" style="font: 800 20px 'Segoe UI', Arial, sans-serif">7</text>
    <text class="ink label" x="1108" y="569">Chiudi</text>
    <text class="muted small" x="1068" y="609">azione</text>
<text class="muted small" x="1068" y="632">cautela</text>
  </g>
  <path class="arrowTeal" d="M535 595 L645 595"/>
  <path class="arrowNavy" d="M920 595 L1030 595"/>
  <g data-safe-box="485 415 630 108 8" data-safe-name="Regola privacy">
    <rect class="softGreen" x="485" y="415" width="630" height="108" rx="20"/>
    <rect x="485" y="415" width="10" height="108" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="509" y="451">Regola privacy</text>
    <text class="muted small" x="509" y="483">informazioni necessarie e soggetti legittimati</text>
<text class="muted small" x="509" y="506">canale previsto e dati minimi</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Professionalita allo sportello significa orientare bene, senza promettere un esito non verificato.</text>
  </g>

</svg>
