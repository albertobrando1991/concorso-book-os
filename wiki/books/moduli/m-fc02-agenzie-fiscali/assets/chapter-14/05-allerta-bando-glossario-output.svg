<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Schede allerta, glossario e output</title>
  <desc id="desc">Parole-spia del bando, appendice corretta, priorita e azione entro 7 giorni.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Schede allerta, glossario e output</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Parole-spia del bando, appendice corretta, priorita e azione entro 7 giorni.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="105 310 210 170 8" data-safe-name="Nuovo bando">
    <rect class="softBlue" x="105" y="310" width="210" height="170" rx="22"/>
    <circle cx="143" cy="348" r="21" fill="#10233F"/>
    <text x="143" y="356" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="131" y="392">Nuovo bando</text>
    <text class="muted small" x="131" y="426">ente, profilo</text>
<text class="muted small" x="131" y="449">programma</text>
  </g>
  <g data-safe-box="380 310 210 170 8" data-safe-name="Parole-spia">
    <rect class="softRed" x="380" y="310" width="210" height="170" rx="22"/>
    <circle cx="418" cy="348" r="21" fill="#7A2430"/>
    <text x="418" y="356" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="406" y="392">Parole-spia</text>
    <text class="muted small" x="406" y="426">reati, UE</text>
<text class="muted small" x="406" y="449">privacy, ICT</text>
  </g>
  <g data-safe-box="655 310 210 170 8" data-safe-name="Appendice">
    <rect class="softGold" x="655" y="310" width="210" height="170" rx="22"/>
    <circle cx="693" cy="348" r="21" fill="#D4AF37"/>
    <text x="693" y="356" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="681" y="392">Appendice</text>
    <text class="muted small" x="681" y="426">A, B, C</text>
<text class="muted small" x="681" y="449">D o E</text>
  </g>
  <g data-safe-box="930 310 210 170 8" data-safe-name="Priorita">
    <rect class="softGreen" x="930" y="310" width="210" height="170" rx="22"/>
    <circle cx="968" cy="348" r="21" fill="#2F7D5A"/>
    <text x="968" y="356" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="956" y="392">Priorita</text>
    <text class="muted small" x="956" y="426">subito, dopo</text>
<text class="muted small" x="956" y="449">taglio</text>
  </g>
  <g data-safe-box="1205 310 210 170 8" data-safe-name="Output">
    <rect class="softTeal" x="1205" y="310" width="210" height="170" rx="22"/>
    <circle cx="1243" cy="348" r="21" fill="#1F6F78"/>
    <text x="1243" y="356" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">5</text>
    <text class="ink label" x="1231" y="392">Output</text>
    <text class="muted small" x="1231" y="426">7 giorni</text>
<text class="muted small" x="1231" y="449">scheda/prova</text>
  </g>
  <path class="arrowNavy" d="M315 394 L370 394"/>
  <path class="arrowBordeaux" d="M590 394 L645 394"/>
  <path class="arrowGold" d="M865 394 L920 394"/>
  <path class="arrowGreen" d="M1140 394 L1195 394"/>
  <g data-safe-box="195 560 360 118 8" data-safe-name="Glossario">
    <rect class="softBlue" x="195" y="560" width="360" height="118" rx="20"/>
    <rect x="195" y="560" width="10" height="118" rx="5" fill="#10233F"/>
    <text class="ink label" x="219" y="596">Glossario</text>
    <text class="muted small" x="219" y="628">stabilizza parole</text>
<text class="muted small" x="219" y="651">prima del quiz</text>
  </g>
  <g data-safe-box="620 560 360 118 8" data-safe-name="Scheda allerta">
    <rect class="softRed" x="620" y="560" width="360" height="118" rx="20"/>
    <rect x="620" y="560" width="10" height="118" rx="5" fill="#7A2430"/>
    <text class="ink label" x="644" y="596">Scheda allerta</text>
    <text class="muted small" x="644" y="628">peso, modulo</text>
<text class="muted small" x="644" y="651">fonte da verificare</text>
  </g>
  <g data-safe-box="1045 560 360 118 8" data-safe-name="Decisione">
    <rect class="softGreen" x="1045" y="560" width="360" height="118" rx="20"/>
    <rect x="1045" y="560" width="10" height="118" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="1069" y="596">Decisione</text>
    <text class="muted small" x="1069" y="628">cosa studiare</text>
<text class="muted small" x="1069" y="651">e cosa non studiare</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Il glossario non e' elenco: e' una macchina per decidere come studiare il bando.</text>
  </g>

</svg>
