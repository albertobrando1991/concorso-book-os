<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dal dato all'atto motivato</title>
  <desc id="desc">La sequenza operativa per non confondere controllo, accertamento e riscossione.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .navy { fill: #10233F; }
      .bordeaux { fill: #7A2430; }
      .gold { fill: #D4AF37; }
      .green { fill: #2F7D5A; }
      .teal { fill: #1F6F78; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 110 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Dal dato all'atto motivato</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">La sequenza operativa per non confondere controllo, accertamento e riscossione.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="95 285 220 164 16" data-safe-name="Dato">
    <rect class="softBlue" x="95" y="285" width="220" height="164" rx="22"/>
    <circle cx="135" cy="327" r="22" fill="#10233F"/>
    <text x="135" y="335" text-anchor="middle" fill="#FFFFFF" style="font: 800 22px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="171" y="335">Dato</text>
    <text class="muted body" x="121" y="377">dichiarazione</text>
<text class="muted body" x="121" y="402">versamento</text>
<text class="muted body" x="121" y="427">segnale</text>
  </g>
  <g data-safe-box="355 285 220 164 16" data-safe-name="Controllo">
    <rect class="softRed" x="355" y="285" width="220" height="164" rx="22"/>
    <circle cx="395" cy="327" r="22" fill="#7A2430"/>
    <text x="395" y="335" text-anchor="middle" fill="#FFFFFF" style="font: 800 22px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="431" y="335">Controllo</text>
    <text class="muted body" x="381" y="377">coerenza</text>
<text class="muted body" x="381" y="402">documenti</text>
<text class="muted body" x="381" y="427">sostanza</text>
  </g>
  <g data-safe-box="615 285 220 164 16" data-safe-name="Istruttoria">
    <rect class="softGold" x="615" y="285" width="220" height="164" rx="22"/>
    <circle cx="655" cy="327" r="22" fill="#D4AF37"/>
    <text x="655" y="335" text-anchor="middle" fill="#FFFFFF" style="font: 800 22px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="691" y="335">Istruttoria</text>
    <text class="muted body" x="641" y="377">richieste</text>
<text class="muted body" x="641" y="402">analisi</text>
<text class="muted body" x="641" y="427">elementi</text>
  </g>
  <g data-safe-box="875 285 220 164 16" data-safe-name="Confronto">
    <rect class="softGreen" x="875" y="285" width="220" height="164" rx="22"/>
    <circle cx="915" cy="327" r="22" fill="#2F7D5A"/>
    <text x="915" y="335" text-anchor="middle" fill="#FFFFFF" style="font: 800 22px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="951" y="335">Confronto</text>
    <text class="muted body" x="901" y="377">garanzie</text>
<text class="muted body" x="901" y="402">chiarimenti</text>
  </g>
  <g data-safe-box="1135 285 220 164 16" data-safe-name="Atto">
    <rect class="softTeal" x="1135" y="285" width="220" height="164" rx="22"/>
    <circle cx="1175" cy="327" r="22" fill="#1F6F78"/>
    <text x="1175" y="335" text-anchor="middle" fill="#FFFFFF" style="font: 800 22px 'Segoe UI', Arial, sans-serif">5</text>
    <text class="ink label" x="1211" y="335">Atto</text>
    <text class="muted body" x="1161" y="377">motivazione</text>
<text class="muted body" x="1161" y="402">pretesa</text>
  </g>
  <path class="arrowNavy" d="M315 367 L345 367"/>
  <path class="arrowBordeaux" d="M575 367 L605 367"/>
  <path class="arrowGold" d="M835 367 L865 367"/>
  <path class="arrowGreen" d="M1095 367 L1125 367"/>
  <g data-safe-box="215 590 280 116 8" data-safe-name="Esito possibile">
    <rect class="softGreen" x="215" y="590" width="280" height="116" rx="20"/>
    <text class="ink label" x="239" y="628">Esito possibile</text>
    <text class="muted body" x="239" y="662">chiarimento</text>
<text class="muted body" x="239" y="687">archiviazione</text>
    <rect x="215" y="590" width="10" height="116" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="655 590 290 116 8" data-safe-name="Atto motivato">
    <rect class="softBlue" x="655" y="590" width="290" height="116" rx="20"/>
    <text class="ink label" x="679" y="628">Atto motivato</text>
    <text class="muted body" x="679" y="662">fatti e regola</text>
<text class="muted body" x="679" y="687">pretesa</text>
    <rect x="655" y="590" width="10" height="116" rx="5" fill="#10233F"/>
  </g>
  <g data-safe-box="1095 590 290 116 8" data-safe-name="Fase distinta">
    <rect class="softRed" x="1095" y="590" width="290" height="116" rx="20"/>
    <text class="ink label" x="1119" y="628">Fase distinta</text>
    <text class="muted body" x="1119" y="662">tutela</text>
<text class="muted body" x="1119" y="687">riscossione</text>
    <rect x="1095" y="590" width="10" height="116" rx="5" fill="#7A2430"/>
  </g>
  <path class="arrowGreen" d="M495 648 L635 648"/>
  <path class="arrowNavy" d="M945 648 L1075 648"/>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Non ogni controllo produce un atto; non ogni atto coincide con riscossione.</text>
  </g>

</svg>
