<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mappa BANDO degli adempimenti fiscali</title>
  <desc id="desc">Redditi, IVA, dichiarazioni, versamenti, compensazioni e servizi come sequenza da concorso.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Mappa BANDO degli adempimenti fiscali</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Redditi, IVA, dichiarazioni, versamenti, compensazioni e servizi come sequenza da concorso.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="555 205 490 122 8" data-safe-name="Adempimenti fiscali">
    <rect class="softBlue" x="555" y="205" width="490" height="122" rx="22"/>
    <circle cx="593" cy="243" r="17" fill="#10233F"/>
    <text class="ink label" x="621" y="250">Adempimenti fiscali</text>
    <text class="muted body" x="581" y="287">redditi, IVA, dichiarazioni</text>
<text class="muted body" x="581" y="314">versamenti e servizi</text>
  </g>
  <path class="line" d="M800 327 L800 370"/>
  <path class="line" d="M205 370 L1395 370"/>
  <path class="line" d="M205 370 L205 460"/>
  <path class="line" d="M505 370 L505 585"/>
  <path class="line" d="M800 370 L800 460"/>
  <path class="line" d="M1095 370 L1095 585"/>
  <path class="line" d="M1395 370 L1395 460"/>
  <g data-safe-box="70 460 270 130 8" data-safe-name="B - Bando">
    <rect class="softBlue" x="70" y="460" width="270" height="130" rx="22"/>
    <circle cx="108" cy="498" r="17" fill="#10233F"/>
    <text class="ink label" x="136" y="505">B - Bando</text>
    <text class="muted body" x="96" y="542">redditi, IVA</text>
<text class="muted body" x="96" y="569">adempimenti</text>
  </g>
  <g data-safe-box="370 585 270 130 8" data-safe-name="A - Aree">
    <rect class="softRed" x="370" y="585" width="270" height="130" rx="22"/>
    <circle cx="408" cy="623" r="17" fill="#7A2430"/>
    <text class="ink label" x="436" y="630">A - Aree</text>
    <text class="muted body" x="396" y="667">dichiarare</text>
<text class="muted body" x="396" y="694">pagare</text>
  </g>
  <g data-safe-box="665 460 270 130 8" data-safe-name="N - Nuclei">
    <rect class="softGold" x="665" y="460" width="270" height="130" rx="22"/>
    <circle cx="703" cy="498" r="17" fill="#D4AF37"/>
    <text class="ink label" x="731" y="505">N - Nuclei</text>
    <text class="muted body" x="691" y="542">debito, credito</text>
<text class="muted body" x="691" y="569">controllo</text>
  </g>
  <g data-safe-box="960 585 270 130 8" data-safe-name="D - Diario">
    <rect class="softGreen" x="960" y="585" width="270" height="130" rx="22"/>
    <circle cx="998" cy="623" r="17" fill="#2F7D5A"/>
    <text class="ink label" x="1026" y="630">D - Diario</text>
    <text class="muted body" x="986" y="667">scambio fasi</text>
<text class="muted body" x="986" y="694">IVA = utile</text>
  </g>
  <g data-safe-box="1260 460 270 130 8" data-safe-name="O - Output">
    <rect class="softTeal" x="1260" y="460" width="270" height="130" rx="22"/>
    <circle cx="1298" cy="498" r="17" fill="#1F6F78"/>
    <text class="ink label" x="1326" y="505">O - Output</text>
    <text class="muted body" x="1286" y="542">mappa</text>
<text class="muted body" x="1286" y="569">flusso</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Gli adempimenti si studiano come sequenza, non come calendario di sigle.</text>
  </g>

</svg>
