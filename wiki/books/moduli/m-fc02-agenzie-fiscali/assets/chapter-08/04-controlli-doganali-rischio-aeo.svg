<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Controlli doganali e rischio</title>
  <desc id="desc">Dati, documenti, controlli fisici e AEO servono a proteggere il commercio legittimo.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Controlli doganali e rischio</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Dati, documenti, controlli fisici e AEO servono a proteggere il commercio legittimo.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="555 235 490 142 16" data-safe-name="Analisi del rischio">
    <rect class="softBlue" x="555" y="235" width="490" height="142" rx="26"/>
    <circle cx="599" cy="279" r="18" fill="#10233F"/>
    <text class="ink label" x="629" y="287">Analisi del rischio</text>
    <text class="muted body" x="589" y="327">seleziona l'intensita</text>
<text class="muted body" x="589" y="355">senza bloccare il lecito</text>
  </g>
  <path class="arrowNavy" d="M800 380 L800 450"/>
  <g data-safe-box="105 475 360 155 12" data-safe-name="Dati anticipati">
    <rect class="softTeal" x="105" y="475" width="360" height="155" rx="24"/>
    <text class="ink label" x="135" y="521">Dati anticipati</text>
    <rect x="135" y="543" width="300" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="137" y="580">arrivo, uscita</text>
<text class="muted body" x="137" y="607">e tracciati</text>
  </g>
  <g data-safe-box="450 475 360 155 12" data-safe-name="Documenti">
    <rect class="softRed" x="450" y="475" width="360" height="155" rx="24"/>
    <text class="ink label" x="480" y="521">Documenti</text>
    <rect x="480" y="543" width="300" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="482" y="580">fatture, trasporto</text>
<text class="muted body" x="482" y="607">autorizzazioni</text>
  </g>
  <g data-safe-box="795 475 360 155 12" data-safe-name="Controllo fisico">
    <rect class="softGold" x="795" y="475" width="360" height="155" rx="24"/>
    <text class="ink label" x="825" y="521">Controllo fisico</text>
    <rect x="825" y="543" width="300" height="4" rx="2" fill="#D4AF37"/>
    <text class="muted body" x="827" y="580">merce reale</text>
<text class="muted body" x="827" y="607">quantita natura</text>
  </g>
  <g data-safe-box="1140 475 360 155 12" data-safe-name="AEO">
    <rect class="softGreen" x="1140" y="475" width="360" height="155" rx="24"/>
    <text class="ink label" x="1170" y="521">AEO</text>
    <rect x="1170" y="543" width="300" height="4" rx="2" fill="#2F7D5A"/>
    <text class="muted body" x="1172" y="580">affidabilita</text>
<text class="muted body" x="1172" y="607">regolata</text>
  </g>
  <path class="arrowTeal" d="M350 555 L440 555"/>
  <path class="arrowBordeaux" d="M695 555 L785 555"/>
  <path class="arrowGold" d="M1040 555 L1130 555"/>
  <g data-safe-box="520 690 560 86 8" data-safe-name="Obiettivo ADM">
    <rect class="softBlue" x="520" y="690" width="560" height="86" rx="20"/>
    <text class="ink label" x="544" y="726">Obiettivo ADM</text>
    <text class="muted small" x="544" y="758">proteggere mercato, entrate, sicurezza e commercio legittimo</text>
    <rect x="520" y="690" width="10" height="86" rx="5" fill="#10233F"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">AEO riduce attriti dove ricorrono requisiti, ma non elimina il potere di controllo.</text>
  </g>

</svg>
