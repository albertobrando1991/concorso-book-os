<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Procedura doganale come sequenza</title>
  <desc id="desc">Dal movimento della merce allo svincolo, passando per dati, regime e controlli.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Procedura doganale come sequenza</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Dal movimento della merce allo svincolo, passando per dati, regime e controlli.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="94 305 170 164 12" data-safe-name="Operatore">
    <rect class="softBlue" x="94" y="305" width="170" height="164" rx="22"/>
    <circle cx="128" cy="343" r="21" fill="#10233F"/>
    <text x="128" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="122" y="387">Operatore</text>
    <text class="muted small" x="122" y="421">ruolo e</text>
<text class="muted small" x="122" y="444">titolo</text>
  </g>
  <g data-safe-box="299 305 170 164 12" data-safe-name="Merce">
    <rect class="softRed" x="299" y="305" width="170" height="164" rx="22"/>
    <circle cx="333" cy="343" r="21" fill="#7A2430"/>
    <text x="333" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="327" y="387">Merce</text>
    <text class="muted small" x="327" y="421">descrizione</text>
<text class="muted small" x="327" y="444">tecnica</text>
  </g>
  <g data-safe-box="504 305 170 164 12" data-safe-name="Triade">
    <rect class="softGold" x="504" y="305" width="170" height="164" rx="22"/>
    <circle cx="538" cy="343" r="21" fill="#D4AF37"/>
    <text x="538" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="532" y="387">Triade</text>
    <text class="muted small" x="532" y="421">classifica</text>
<text class="muted small" x="532" y="444">origine valore</text>
  </g>
  <g data-safe-box="709 305 170 164 12" data-safe-name="Regime">
    <rect class="softGreen" x="709" y="305" width="170" height="164" rx="22"/>
    <circle cx="743" cy="343" r="21" fill="#2F7D5A"/>
    <text x="743" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="737" y="387">Regime</text>
    <text class="muted small" x="737" y="421">import</text>
<text class="muted small" x="737" y="444">export transito</text>
  </g>
  <g data-safe-box="914 305 170 164 12" data-safe-name="Dati">
    <rect class="softTeal" x="914" y="305" width="170" height="164" rx="22"/>
    <circle cx="948" cy="343" r="21" fill="#1F6F78"/>
    <text x="948" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">5</text>
    <text class="ink label" x="942" y="387">Dati</text>
    <text class="muted small" x="942" y="421">documenti</text>
<text class="muted small" x="942" y="444">e sistemi</text>
  </g>
  <g data-safe-box="1119 305 170 164 12" data-safe-name="Controllo">
    <rect class="softBlue" x="1119" y="305" width="170" height="164" rx="22"/>
    <circle cx="1153" cy="343" r="21" fill="#10233F"/>
    <text x="1153" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">6</text>
    <text class="ink label" x="1147" y="387">Controllo</text>
    <text class="muted small" x="1147" y="421">rischio</text>
<text class="muted small" x="1147" y="444">verifiche</text>
  </g>
  <g data-safe-box="1324 305 170 164 12" data-safe-name="Svincolo">
    <rect class="softRed" x="1324" y="305" width="170" height="164" rx="22"/>
    <circle cx="1358" cy="343" r="21" fill="#7A2430"/>
    <text x="1358" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">7</text>
    <text class="ink label" x="1352" y="387">Svincolo</text>
    <text class="muted small" x="1352" y="421">o esito</text>
<text class="muted small" x="1352" y="444">successivo</text>
  </g>
  <path class="arrowNavy" d="M264 387 L289 387"/>
  <path class="arrowBordeaux" d="M469 387 L494 387"/>
  <path class="arrowGold" d="M674 387 L699 387"/>
  <path class="arrowGreen" d="M879 387 L904 387"/>
  <path class="arrowTeal" d="M1084 387 L1109 387"/>
  <path class="arrowNavy" d="M1289 387 L1314 387"/>
  <g data-safe-box="250 595 330 106 8" data-safe-name="Nodo dati">
    <rect class="softRed" x="250" y="595" width="330" height="106" rx="20"/>
    <text class="ink label" x="274" y="631">Nodo dati</text>
    <text class="muted small" x="274" y="663">merce reale e documenti</text>
    <rect x="250" y="595" width="10" height="106" rx="5" fill="#7A2430"/>
  </g>
  <g data-safe-box="635 595 330 106 8" data-safe-name="Nodo regime">
    <rect class="softGold" x="635" y="595" width="330" height="106" rx="20"/>
    <text class="ink label" x="659" y="631">Nodo regime</text>
    <text class="muted small" x="659" y="663">effetti e formalita</text>
    <rect x="635" y="595" width="10" height="106" rx="5" fill="#D4AF37"/>
  </g>
  <g data-safe-box="1020 595 330 106 8" data-safe-name="Nodo rischio">
    <rect class="softGreen" x="1020" y="595" width="330" height="106" rx="20"/>
    <text class="ink label" x="1044" y="631">Nodo rischio</text>
    <text class="muted small" x="1044" y="663">controllo proporzionato</text>
    <rect x="1020" y="595" width="10" height="106" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">La procedura doganale non e' solo pagamento: e' qualificazione, regime e controllo.</text>
  </g>

</svg>
