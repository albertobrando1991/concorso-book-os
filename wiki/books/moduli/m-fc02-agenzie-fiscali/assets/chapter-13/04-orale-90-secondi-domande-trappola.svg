<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Risposta orale da 90 secondi</title>
  <desc id="desc">Definizione, funzione, soggetti, sequenza, esempio e limite.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Risposta orale da 90 secondi</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Definizione, funzione, soggetti, sequenza, esempio e limite.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="590 315 420 170 8" data-safe-name="Risposta 90 secondi">
    <rect class="softBlue" x="590" y="315" width="420" height="170" rx="26"/>
    <circle cx="634" cy="359" r="18" fill="#10233F"/>
    <text class="ink label" x="664" y="367">Risposta 90 secondi</text>
    <text class="muted body" x="624" y="407">ordine, lessico</text>
<text class="muted body" x="624" y="435">e chiusura prudente</text>
  </g>
  <g data-safe-box="155 225 360 118 8" data-safe-name="1. Definizione">
    <rect class="softBlue" x="155" y="225" width="360" height="118" rx="22"/>
    <rect x="155" y="225" width="10" height="118" rx="5" fill="#10233F"/>
    <text class="ink label" x="183" y="267">1. Definizione</text>
    <text class="muted body" x="185" y="305">che cos'e'</text>
  </g>
  <g data-safe-box="570 205 360 118 8" data-safe-name="2. Funzione">
    <rect class="softRed" x="570" y="205" width="360" height="118" rx="22"/>
    <rect x="570" y="205" width="10" height="118" rx="5" fill="#7A2430"/>
    <text class="ink label" x="598" y="247">2. Funzione</text>
    <text class="muted body" x="600" y="285">a cosa serve</text>
  </g>
  <g data-safe-box="985 225 360 118 8" data-safe-name="3. Soggetti">
    <rect class="softGold" x="985" y="225" width="360" height="118" rx="22"/>
    <rect x="985" y="225" width="10" height="118" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="1013" y="267">3. Soggetti</text>
    <text class="muted body" x="1015" y="305">chi interviene</text>
  </g>
  <g data-safe-box="155 545 360 118 8" data-safe-name="4. Sequenza">
    <rect class="softGreen" x="155" y="545" width="360" height="118" rx="22"/>
    <rect x="155" y="545" width="10" height="118" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="183" y="587">4. Sequenza</text>
    <text class="muted body" x="185" y="625">prima / dopo</text>
  </g>
  <g data-safe-box="570 565 360 118 8" data-safe-name="5. Esempio">
    <rect class="softTeal" x="570" y="565" width="360" height="118" rx="22"/>
    <rect x="570" y="565" width="10" height="118" rx="5" fill="#1F6F78"/>
    <text class="ink label" x="598" y="607">5. Esempio</text>
    <text class="muted body" x="600" y="645">profilo fiscale</text>
  </g>
  <g data-safe-box="985 545 360 118 8" data-safe-name="6. Limite">
    <rect class="softRed" x="985" y="545" width="360" height="118" rx="22"/>
    <rect x="985" y="545" width="10" height="118" rx="5" fill="#7A2430"/>
    <text class="ink label" x="1013" y="587">6. Limite</text>
    <text class="muted body" x="1015" y="625">non confondere</text>
  </g>
  <path class="line" d="M430 292 L580 360"/>
  <path class="line" d="M790 290 L950 360"/>
  <path class="line" d="M430 610 L580 450"/>
  <path class="line" d="M790 610 L950 450"/>
  <g data-safe-box="510 690 580 92 8" data-safe-name="Domanda-trappola">
    <rect class="softGold" x="510" y="690" width="580" height="92" rx="20"/>
    <rect x="510" y="690" width="10" height="92" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="534" y="726">Domanda-trappola</text>
    <text class="muted small" x="534" y="758">correggi la premessa, poi spiega il criterio</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Una risposta forte non dice tutto: definisce, collega e sa fermarsi.</text>
  </g>
</svg>
