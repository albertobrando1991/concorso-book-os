<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mappa BANDO della prestazione finale</title>
  <desc id="desc">Dal bando agli output: quiz, caso, orale, diario errori e piano.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Mappa BANDO della prestazione finale</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Dal bando agli output: quiz, caso, orale, diario errori e piano.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="510 205 580 142 8" data-safe-name="Prestazione M-FC02">
    <rect class="softBlue" x="510" y="205" width="580" height="142" rx="26"/>
    <circle cx="554" cy="249" r="18" fill="#10233F"/>
    <text class="ink label" x="584" y="257">Prestazione M-FC02</text>
    <text class="muted body" x="544" y="297">quiz, caso, orale</text>
<text class="muted body" x="544" y="325">diario e piano finale</text>
  </g>
  <path class="arrowNavy" d="M800 348 L800 380"/>
  <path class="line" d="M205 380 L1395 380"/>
  <path class="line" d="M205 380 L205 470"/>
  <path class="line" d="M505 380 L505 590"/>
  <path class="line" d="M800 380 L800 470"/>
  <path class="line" d="M1095 380 L1095 590"/>
  <path class="line" d="M1395 380 L1395 470"/>
  <g data-safe-box="70 470 270 132 8" data-safe-name="B - Prova">
    <rect class="softBlue" x="70" y="470" width="270" height="132" rx="22"/>
    <circle cx="108" cy="508" r="17" fill="#10233F"/>
    <text class="ink label" x="136" y="515">B - Prova</text>
    <text class="muted body" x="96" y="552">format, soglie</text>
<text class="muted body" x="96" y="579">tempo e avvisi</text>
  </g>
  <g data-safe-box="370 590 270 132 8" data-safe-name="A - Materie">
    <rect class="softRed" x="370" y="590" width="270" height="132" rx="22"/>
    <circle cx="408" cy="628" r="17" fill="#7A2430"/>
    <text class="ink label" x="436" y="635">A - Materie</text>
    <text class="muted body" x="396" y="672">tributario</text>
<text class="muted body" x="396" y="699">dogane, AdER</text>
  </g>
  <g data-safe-box="665 470 270 132 8" data-safe-name="N - Nuclei">
    <rect class="softGold" x="665" y="470" width="270" height="132" rx="22"/>
    <circle cx="703" cy="508" r="17" fill="#D4AF37"/>
    <text class="ink label" x="731" y="515">N - Nuclei</text>
    <text class="muted body" x="691" y="552">enti, atti</text>
<text class="muted body" x="691" y="579">sequenze</text>
  </g>
  <g data-safe-box="960 590 270 132 8" data-safe-name="D - Errori">
    <rect class="softGreen" x="960" y="590" width="270" height="132" rx="22"/>
    <circle cx="998" cy="628" r="17" fill="#2F7D5A"/>
    <text class="ink label" x="1026" y="635">D - Errori</text>
    <text class="muted body" x="986" y="672">memoria, lettura</text>
<text class="muted body" x="986" y="699">piani confusi</text>
  </g>
  <g data-safe-box="1260 470 270 132 8" data-safe-name="O - Output">
    <rect class="softTeal" x="1260" y="470" width="270" height="132" rx="22"/>
    <circle cx="1298" cy="508" r="17" fill="#1F6F78"/>
    <text class="ink label" x="1326" y="515">O - Output</text>
    <text class="muted body" x="1286" y="552">simulazione</text>
<text class="muted body" x="1286" y="579">piano 30/60/90</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Il capitolo trasforma programma e studio in prestazioni misurabili.</text>
  </g>
</svg>
