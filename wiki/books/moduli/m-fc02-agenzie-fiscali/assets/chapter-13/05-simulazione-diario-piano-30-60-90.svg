<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Simulazione, diario e piano 30/60/90</title>
  <desc id="desc">La prova finale produce dati, correzioni e priorita di studio.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Simulazione, diario e piano 30/60/90</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">La prova finale produce dati, correzioni e priorita di studio.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="100 238 240 190 10" data-safe-name="Quiz">
    <rect class="softBlue" x="100" y="238" width="240" height="190" rx="24"/>
    <text class="ink label" x="128" y="282">Quiz</text>
    <text class="muted body" x="128" y="316">35 min</text>
    <rect x="128" y="334" width="184" height="5" rx="2.5" fill="#10233F"/>
    <text class="muted small" x="130" y="373">punteggio</text>
<text class="muted small" x="130" y="397">domande lente</text>
  </g>
  <g data-safe-box="410 238 240 190 10" data-safe-name="Caso">
    <rect class="softRed" x="410" y="238" width="240" height="190" rx="24"/>
    <text class="ink label" x="438" y="282">Caso</text>
    <text class="muted body" x="438" y="316">25 min</text>
    <rect x="438" y="334" width="184" height="5" rx="2.5" fill="#7A2430"/>
    <text class="muted small" x="440" y="373">griglia</text>
<text class="muted small" x="440" y="397">conclusione</text>
  </g>
  <g data-safe-box="720 238 240 190 10" data-safe-name="Orale">
    <rect class="softGold" x="720" y="238" width="240" height="190" rx="24"/>
    <text class="ink label" x="748" y="282">Orale</text>
    <text class="muted body" x="748" y="316">20 min</text>
    <rect x="748" y="334" width="184" height="5" rx="2.5" fill="#D4AF37"/>
    <text class="muted small" x="750" y="373">3 risposte</text>
<text class="muted small" x="750" y="397">90 secondi</text>
  </g>
  <g data-safe-box="1030 238 240 190 10" data-safe-name="Diario">
    <rect class="softGreen" x="1030" y="238" width="240" height="190" rx="24"/>
    <text class="ink label" x="1058" y="282">Diario</text>
    <text class="muted body" x="1058" y="316">10 min</text>
    <rect x="1058" y="334" width="184" height="5" rx="2.5" fill="#2F7D5A"/>
    <text class="muted small" x="1060" y="373">cause</text>
<text class="muted small" x="1060" y="397">azioni</text>
  </g>
  <path class="arrowNavy" d="M330 330 L400 330"/>
  <path class="arrowBordeaux" d="M640 330 L710 330"/>
  <path class="arrowGold" d="M950 330 L1020 330"/>
  <path class="arrowGreen" d="M1180 440 L1180 500"/>
  <g data-safe-box="520 520 560 144 8" data-safe-name="Piano 30/60/90">
    <rect class="softTeal" x="520" y="520" width="560" height="144" rx="26"/>
    <circle cx="564" cy="564" r="18" fill="#1F6F78"/>
    <text class="ink label" x="594" y="572">Piano 30/60/90</text>
    <text class="muted body" x="554" y="612">30: fondamenta  |  60: casi</text>
<text class="muted body" x="554" y="640">90: simulazioni e rifinitura</text>
  </g>
  <g data-safe-box="120 555 320 112 8" data-safe-name="Dati utili">
    <rect class="softGold" x="120" y="555" width="320" height="112" rx="20"/>
    <rect x="120" y="555" width="10" height="112" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="144" y="591">Dati utili</text>
    <text class="muted small" x="144" y="623">errori ricorrenti</text>
<text class="muted small" x="144" y="646">materie lente</text>
  </g>
  <g data-safe-box="1160 555 320 112 8" data-safe-name="Priorita">
    <rect class="softBlue" x="1160" y="555" width="320" height="112" rx="20"/>
    <rect x="1160" y="555" width="10" height="112" rx="5" fill="#10233F"/>
    <text class="ink label" x="1184" y="591">Priorita</text>
    <text class="muted small" x="1184" y="623">ripasso mirato</text>
<text class="muted small" x="1184" y="646">verifica</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">La simulazione vale solo se produce correzioni e una prossima azione verificabile.</text>
  </g>
</svg>
