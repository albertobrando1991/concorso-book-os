<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quiz M-FC02: quattro mosse</title>
  <desc id="desc">Lettura, esclusione, scelta e controllo delle parole-spia.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Quiz M-FC02: quattro mosse</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Lettura, esclusione, scelta e controllo delle parole-spia.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="150 270 215 170 8" data-safe-name="Lettura">
    <rect class="softBlue" x="150" y="270" width="215" height="170" rx="22"/>
    <circle cx="188" cy="308" r="21" fill="#10233F"/>
    <text x="188" y="316" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="176" y="352">Lettura</text>
    <text class="muted small" x="176" y="386">richiesta</text>
<text class="muted small" x="176" y="409">parola-spia</text>
  </g>
  <g data-safe-box="455 270 215 170 8" data-safe-name="Esclusione">
    <rect class="softRed" x="455" y="270" width="215" height="170" rx="22"/>
    <circle cx="493" cy="308" r="21" fill="#7A2430"/>
    <text x="493" y="316" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="481" y="352">Esclusione</text>
    <text class="muted small" x="481" y="386">soggetto</text>
<text class="muted small" x="481" y="409">fase</text>
  </g>
  <g data-safe-box="760 270 215 170 8" data-safe-name="Scelta">
    <rect class="softGold" x="760" y="270" width="215" height="170" rx="22"/>
    <circle cx="798" cy="308" r="21" fill="#D4AF37"/>
    <text x="798" y="316" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="786" y="352">Scelta</text>
    <text class="muted small" x="786" y="386">opzione</text>
<text class="muted small" x="786" y="409">perimetro</text>
  </g>
  <g data-safe-box="1065 270 215 170 8" data-safe-name="Controllo">
    <rect class="softGreen" x="1065" y="270" width="215" height="170" rx="22"/>
    <circle cx="1103" cy="308" r="21" fill="#2F7D5A"/>
    <text x="1103" y="316" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="1091" y="352">Controllo</text>
    <text class="muted small" x="1091" y="386">negazioni</text>
<text class="muted small" x="1091" y="409">assoluti</text>
  </g>
  <path class="arrowNavy" d="M365 354 L445 354"/>
  <path class="arrowBordeaux" d="M670 354 L750 354"/>
  <path class="arrowGold" d="M975 354 L1055 354"/>
  <g data-safe-box="185 555 305 112 8" data-safe-name="Banca dati">
    <rect class="softTeal" x="185" y="555" width="305" height="112" rx="20"/>
    <rect x="185" y="555" width="10" height="112" rx="5" fill="#1F6F78"/>
    <text class="ink label" x="209" y="591">Banca dati</text>
    <text class="muted small" x="209" y="623">versione</text>
<text class="muted small" x="209" y="646">tag errori</text>
  </g>
  <g data-safe-box="520 555 305 112 8" data-safe-name="Senza banca">
    <rect class="softBlue" x="520" y="555" width="305" height="112" rx="20"/>
    <rect x="520" y="555" width="10" height="112" rx="5" fill="#10233F"/>
    <text class="ink label" x="544" y="591">Senza banca</text>
    <text class="muted small" x="544" y="623">nuclei bando</text>
<text class="muted small" x="544" y="646">quiz mirati</text>
  </g>
  <g data-safe-box="855 555 305 112 8" data-safe-name="Parole-spia">
    <rect class="softRed" x="855" y="555" width="305" height="112" rx="20"/>
    <rect x="855" y="555" width="10" height="112" rx="5" fill="#7A2430"/>
    <text class="ink label" x="879" y="591">Parole-spia</text>
    <text class="muted small" x="879" y="623">non, sempre</text>
<text class="muted small" x="879" y="646">ente, cartella</text>
  </g>
  <g data-safe-box="1190 555 225 112 8" data-safe-name="Diario">
    <rect class="softGreen" x="1190" y="555" width="225" height="112" rx="20"/>
    <rect x="1190" y="555" width="10" height="112" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="1214" y="591">Diario</text>
    <text class="muted small" x="1214" y="623">causa</text>
<text class="muted small" x="1214" y="646">azione</text>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Il quiz premia precisione: prima capisci il piano, poi scegli la risposta.</text>
  </g>
</svg>
