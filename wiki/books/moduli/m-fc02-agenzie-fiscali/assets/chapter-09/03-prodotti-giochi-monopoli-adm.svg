<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prodotti, giochi e monopoli</title>
  <desc id="desc">Le aree ADM da riconoscere: energia, alcole, tabacchi, giochi e rete autorizzata.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Prodotti, giochi e monopoli</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Le aree ADM da riconoscere: energia, alcole, tabacchi, giochi e rete autorizzata.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="560 215 480 142 16" data-safe-name="ADM presidio regolato">
    <rect class="softBlue" x="560" y="215" width="480" height="142" rx="26"/>
    <circle cx="604" cy="259" r="18" fill="#10233F"/>
    <text class="ink label" x="634" y="267">ADM presidio regolato</text>
    <text class="muted body" x="594" y="307">tributo, concessione</text>
<text class="muted body" x="594" y="335">legalita e controllo</text>
  </g>
  <path class="line" d="M800 357 L800 408"/>
  <path class="line" d="M280 408 L1320 408"/>
  <path class="line" d="M280 408 L280 500"/>
  <path class="line" d="M540 408 L540 500"/>
  <path class="line" d="M800 408 L800 500"/>
  <path class="line" d="M1060 408 L1060 500"/>
  <path class="line" d="M1320 408 L1320 500"/>
  <g data-safe-box="120 500 320 150 12" data-safe-name="Prodotti energetici">
    <rect class="softBlue" x="120" y="500" width="320" height="150" rx="24"/>
    <text class="ink label" x="150" y="546">Prodotti energetici</text>
    <rect x="150" y="568" width="260" height="4" rx="2" fill="#10233F"/>
    <text class="muted body" x="152" y="605">deposito</text>
<text class="muted body" x="152" y="632">circolazione</text>
  </g>
  <g data-safe-box="480 500 320 150 12" data-safe-name="Alcole e bevande">
    <rect class="softRed" x="480" y="500" width="320" height="150" rx="24"/>
    <text class="ink label" x="510" y="546">Alcole e bevande</text>
    <rect x="510" y="568" width="260" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="512" y="605">filiera</text>
<text class="muted body" x="512" y="632">imposta</text>
  </g>
  <g data-safe-box="840 500 320 150 12" data-safe-name="Energia e gas">
    <rect class="softGold" x="840" y="500" width="320" height="150" rx="24"/>
    <text class="ink label" x="870" y="546">Energia e gas</text>
    <rect x="870" y="568" width="260" height="4" rx="2" fill="#D4AF37"/>
    <text class="muted body" x="872" y="605">fornitura</text>
<text class="muted body" x="872" y="632">consumo</text>
  </g>
  <g data-safe-box="1200 500 320 150 12" data-safe-name="Tabacchi e giochi">
    <rect class="softTeal" x="1200" y="500" width="320" height="150" rx="24"/>
    <text class="ink label" x="1230" y="546">Tabacchi e giochi</text>
    <rect x="1230" y="568" width="260" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="1232" y="605">rete legale</text>
<text class="muted body" x="1232" y="632">concessioni</text>
  </g>
  <g data-safe-box="520 690 560 86 8" data-safe-name="Idea comune">
    <rect class="softGreen" x="520" y="690" width="560" height="86" rx="20"/>
    <text class="ink label" x="544" y="726">Idea comune</text>
    <text class="muted small" x="544" y="758">settori sensibili, titoli pubblici, dati e controlli ADM</text>
    <rect x="520" y="690" width="10" height="86" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Non memorizzare aliquote: riconosci area, soggetto, obbligo e controllo.</text>
  </g>

</svg>
