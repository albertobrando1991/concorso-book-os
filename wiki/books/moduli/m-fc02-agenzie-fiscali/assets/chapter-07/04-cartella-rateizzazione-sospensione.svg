<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cartella, rateizzazione e sospensione</title>
  <desc id="desc">Atto, pagamento nel tempo, pausa regolata e tutela non sono sinonimi.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Cartella, rateizzazione e sospensione</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Atto, pagamento nel tempo, pausa regolata e tutela non sono sinonimi.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="560 220 480 160 16" data-safe-name="Posizione di riscossione">
    <rect class="softBlue" x="560" y="220" width="480" height="160" rx="26"/>
    <circle cx="604" cy="264" r="18" fill="#10233F"/>
    <text class="ink label" x="634" y="272">Posizione di riscossione</text>
    <text class="muted body" x="594" y="312">atto, importi, soggetto</text>
<text class="muted body" x="594" y="340">e canale operativo</text>
  </g>
  <path class="line" d="M800 380 L800 425"/>
  <path class="line" d="M310 425 L1290 425"/>
  <path class="line" d="M310 425 L310 485"/>
  <path class="line" d="M635 425 L635 485"/>
  <path class="line" d="M965 425 L965 485"/>
  <path class="line" d="M1290 425 L1290 485"/>
  <g data-safe-box="130 485 360 155 12" data-safe-name="Cartella">
    <rect class="softBlue" x="130" y="485" width="360" height="155" rx="24"/>
    <text class="ink label" x="160" y="531">Cartella</text>
    <rect x="160" y="553" width="300" height="4" rx="2" fill="#10233F"/>
    <text class="muted body" x="162" y="590">rende conoscibile</text>
<text class="muted body" x="162" y="617">atto e importi</text>
  </g>
  <g data-safe-box="455 485 360 155 12" data-safe-name="Pagamento">
    <rect class="softGreen" x="455" y="485" width="360" height="155" rx="24"/>
    <text class="ink label" x="485" y="531">Pagamento</text>
    <rect x="485" y="553" width="300" height="4" rx="2" fill="#2F7D5A"/>
    <text class="muted body" x="487" y="590">adempimento</text>
<text class="muted body" x="487" y="617">tracciabile</text>
  </g>
  <g data-safe-box="785 485 360 155 12" data-safe-name="Rateizzazione">
    <rect class="softTeal" x="785" y="485" width="360" height="155" rx="24"/>
    <text class="ink label" x="815" y="531">Rateizzazione</text>
    <rect x="815" y="553" width="300" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="817" y="590">piano nel tempo</text>
<text class="muted body" x="817" y="617">non e' sconto</text>
  </g>
  <g data-safe-box="1110 485 360 155 12" data-safe-name="Sospensione">
    <rect class="softRed" x="1110" y="485" width="360" height="155" rx="24"/>
    <text class="ink label" x="1140" y="531">Sospensione</text>
    <rect x="1140" y="553" width="300" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="1142" y="590">pausa regolata</text>
<text class="muted body" x="1142" y="617">non annulla</text>
  </g>
  <g data-safe-box="430 700 740 70 8" data-safe-name="Sgravio e tutela: competenza e atto corretto.">
    <rect class="softGold" x="430" y="700" width="740" height="70" rx="20"/>
    <text class="ink label" x="454" y="736">Sgravio e tutela: competenza e atto corretto.</text>
    
    <rect x="430" y="700" width="10" height="70" rx="5" fill="#D4AF37"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Le parole vicine non sono sinonimi: cambiano effetti, competenza e documenti richiesti.</text>
  </g>

</svg>
