<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Checklist front-office AdER</title>
  <desc id="desc">L'operatore orienta il debitore partendo da identita, atto, posizione e competenza.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Checklist front-office AdER</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">L'operatore orienta il debitore partendo da identita, atto, posizione e competenza.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="130 230 415 88 10" data-safe-name="1. Identita">
    <rect class="softBlue" x="130" y="230" width="415" height="88" rx="20"/>
    <rect x="130" y="230" width="10" height="88" rx="5" fill="#10233F"/>
    <text class="ink label" x="156" y="265">1. Identita</text>
    <text class="muted small" x="158" y="294">soggetto e titolo</text>
  </g>
  <g data-safe-box="130 340 415 88 10" data-safe-name="2. Atto">
    <rect class="softRed" x="130" y="340" width="415" height="88" rx="20"/>
    <rect x="130" y="340" width="10" height="88" rx="5" fill="#7A2430"/>
    <text class="ink label" x="156" y="375">2. Atto</text>
    <text class="muted small" x="158" y="404">documento ricevuto</text>
  </g>
  <g data-safe-box="130 450 415 88 10" data-safe-name="3. Ente creditore">
    <rect class="softGold" x="130" y="450" width="415" height="88" rx="20"/>
    <rect x="130" y="450" width="10" height="88" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="156" y="485">3. Ente creditore</text>
    <text class="muted small" x="158" y="514">origine del credito</text>
  </g>
  <g data-safe-box="130 560 415 88 10" data-safe-name="4. Posizione">
    <rect class="softGreen" x="130" y="560" width="415" height="88" rx="20"/>
    <rect x="130" y="560" width="10" height="88" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="156" y="595">4. Posizione</text>
    <text class="muted small" x="158" y="624">importi e carichi</text>
  </g>
  <g data-safe-box="1055 230 415 88 10" data-safe-name="5. Richiesta">
    <rect class="softTeal" x="1055" y="230" width="415" height="88" rx="20"/>
    <rect x="1055" y="230" width="10" height="88" rx="5" fill="#1F6F78"/>
    <text class="ink label" x="1081" y="265">5. Richiesta</text>
    <text class="muted small" x="1083" y="294">pagare o contestare</text>
  </g>
  <g data-safe-box="1055 340 415 88 10" data-safe-name="6. Documenti">
    <rect class="softBlue" x="1055" y="340" width="415" height="88" rx="20"/>
    <rect x="1055" y="340" width="10" height="88" rx="5" fill="#10233F"/>
    <text class="ink label" x="1081" y="375">6. Documenti</text>
    <text class="muted small" x="1083" y="404">ricevute e istanze</text>
  </g>
  <g data-safe-box="1055 450 415 88 10" data-safe-name="7. Esito">
    <rect class="softRed" x="1055" y="450" width="415" height="88" rx="20"/>
    <rect x="1055" y="450" width="10" height="88" rx="5" fill="#7A2430"/>
    <text class="ink label" x="1081" y="485">7. Esito</text>
    <text class="muted small" x="1083" y="514">cosa puo' fare l'ufficio</text>
  </g>
  <g data-safe-box="595 330 410 190 16" data-safe-name="Canale corretto">
    <rect class="softTeal" x="595" y="330" width="410" height="190" rx="26"/>
    <circle cx="639" cy="374" r="18" fill="#1F6F78"/>
    <text class="ink label" x="669" y="382">Canale corretto</text>
    <text class="muted body" x="629" y="422">pagamento</text>
<text class="muted body" x="629" y="450">rate e sospensione</text>
<text class="muted body" x="629" y="478">ente o tutela</text>
  </g>
  <path class="arrowGreen" d="M555 405 L585 405"/>
  <path class="arrowTeal" d="M1015 405 L1045 405"/>
  <g data-safe-box="600 580 400 96 8" data-safe-name="Legalita pratica">
    <rect class="softGold" x="600" y="580" width="400" height="96" rx="20"/>
    <text class="ink label" x="624" y="616">Legalita pratica</text>
    <text class="muted small" x="624" y="648">chiarezza, privacy e limiti</text>
    <rect x="600" y="580" width="10" height="96" rx="5" fill="#D4AF37"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Una buona risposta di sportello e' ordinata: documenti, competenza, canale, tracciabilita.</text>
  </g>

</svg>
