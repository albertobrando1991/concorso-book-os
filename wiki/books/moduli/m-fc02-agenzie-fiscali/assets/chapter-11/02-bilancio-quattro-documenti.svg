<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bilancio d'esercizio in quattro documenti</title>
  <desc id="desc">Stato patrimoniale, conto economico, rendiconto e nota integrativa.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Bilancio d'esercizio in quattro documenti</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Stato patrimoniale, conto economico, rendiconto e nota integrativa.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="530 215 540 132 8" data-safe-name="Bilancio d'esercizio">
    <rect class="softBlue" x="530" y="215" width="540" height="132" rx="26"/>
    <circle cx="574" cy="259" r="18" fill="#10233F"/>
    <text class="ink label" x="604" y="267">Bilancio d'esercizio</text>
    <text class="muted body" x="564" y="307">rappresentazione patrimoniale</text>
<text class="muted body" x="564" y="335">finanziaria ed economica</text>
  </g>
  <path class="arrowNavy" d="M800 347 L800 410"/>
  <path class="line" d="M260 410 L1340 410"/>
  <path class="line" d="M260 410 L260 490"/>
  <path class="line" d="M620 410 L620 490"/>
  <path class="line" d="M980 410 L980 490"/>
  <path class="line" d="M1340 410 L1340 490"/>
  <g data-safe-box="100 490 320 170 0" data-safe-name="Stato patr.">
    <rect class="softBlue" x="100" y="490" width="320" height="170" rx="24"/>
    <text class="ink label" x="128" y="536">Stato patr.</text>
    <rect x="128" y="558" width="264" height="4" rx="2" fill="#10233F"/>
    <text class="muted body" x="130" y="595">attivita</text>
<text class="muted body" x="130" y="622">passivita</text>
<text class="muted body" x="130" y="649">patrimonio</text>
  </g>
  <g data-safe-box="460 490 320 170 0" data-safe-name="Conto econ.">
    <rect class="softRed" x="460" y="490" width="320" height="170" rx="24"/>
    <text class="ink label" x="488" y="536">Conto econ.</text>
    <rect x="488" y="558" width="264" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="490" y="595">ricavi</text>
<text class="muted body" x="490" y="622">costi</text>
<text class="muted body" x="490" y="649">risultato</text>
  </g>
  <g data-safe-box="820 490 320 170 0" data-safe-name="Rendiconto">
    <rect class="softGold" x="820" y="490" width="320" height="170" rx="24"/>
    <text class="ink label" x="848" y="536">Rendiconto</text>
    <rect x="848" y="558" width="264" height="4" rx="2" fill="#D4AF37"/>
    <text class="muted body" x="850" y="595">flussi</text>
<text class="muted body" x="850" y="622">liquidita</text>
<text class="muted body" x="850" y="649">incassi/pag.</text>
  </g>
  <g data-safe-box="1180 490 320 170 0" data-safe-name="Nota integr.">
    <rect class="softTeal" x="1180" y="490" width="320" height="170" rx="24"/>
    <text class="ink label" x="1208" y="536">Nota integr.</text>
    <rect x="1208" y="558" width="264" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="1210" y="595">criteri</text>
<text class="muted body" x="1210" y="622">dettagli</text>
<text class="muted body" x="1210" y="649">chiarimenti</text>
  </g>
  <g data-safe-box="320 705 960 72 0" data-safe-name="Domanda guida">
    <rect class="softGreen" x="320" y="705" width="960" height="72" rx="20"/>
    <text class="ink label" x="344" y="741">Domanda guida</text>
    <text class="muted small" x="344" y="773">che cosa racconta il documento e quale dato puo' interessare al fisco?</text>
    <rect x="320" y="705" width="10" height="72" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">La prova non chiede tutto il bilancio: chiede di non confondere funzione e documento.</text>
  </g>
</svg>
