<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Credito, debito e piani giuridici</title>
  <desc id="desc">Rapporto privato, obbligo tributario e riscossione non sono la stessa cosa.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Credito, debito e piani giuridici</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Rapporto privato, obbligo tributario e riscossione non sono la stessa cosa.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="575 205 450 108 0" data-safe-name="Parola comune">
    <rect class="softGold" x="575" y="205" width="450" height="108" rx="26"/>
    <circle cx="619" cy="249" r="18" fill="#D4AF37"/>
    <text class="ink label" x="649" y="257">Parola comune</text>
    <text class="muted body" x="609" y="297">credito / debito</text>
  </g>
  <path class="arrowGold" d="M800 315 L800 375"/>
  <path class="line" d="M300 375 L1300 375"/>
  <path class="line" d="M300 375 L300 455"/>
  <path class="line" d="M800 375 L800 455"/>
  <path class="line" d="M1300 375 L1300 455"/>
  <g data-safe-box="115 455 370 170 0" data-safe-name="Rapporto privato">
    <rect class="softBlue" x="115" y="455" width="370" height="170" rx="24"/>
    <rect x="115" y="455" width="11" height="170" rx="5.5" fill="#10233F"/>
    <text class="ink label" x="147" y="500">Rapporto privato</text>
    <text class="muted body" x="149" y="539">contratto</text>
<text class="muted body" x="149" y="568">fornitore/cliente</text>
<text class="muted body" x="149" y="597">adempimento</text>
  </g>
  <g data-safe-box="615 455 370 170 0" data-safe-name="Obbligo tributario">
    <rect class="softRed" x="615" y="455" width="370" height="170" rx="24"/>
    <rect x="615" y="455" width="11" height="170" rx="5.5" fill="#7A2430"/>
    <text class="ink label" x="647" y="500">Obbligo tributario</text>
    <text class="muted body" x="649" y="539">presupposto</text>
<text class="muted body" x="649" y="568">dichiarazione/versamento</text>
<text class="muted body" x="649" y="597">disciplina pubblica</text>
  </g>
  <g data-safe-box="1115 455 370 170 0" data-safe-name="Riscossione">
    <rect class="softTeal" x="1115" y="455" width="370" height="170" rx="24"/>
    <rect x="1115" y="455" width="11" height="170" rx="5.5" fill="#1F6F78"/>
    <text class="ink label" x="1147" y="500">Riscossione</text>
    <text class="muted body" x="1149" y="539">ente creditore</text>
<text class="muted body" x="1149" y="568">cartella/posizione</text>
<text class="muted body" x="1149" y="597">pagamento o tutela</text>
  </g>
  <g data-safe-box="365 675 870 88 0" data-safe-name="Regola anti-trappola">
    <rect class="softGreen" x="365" y="675" width="870" height="88" rx="20"/>
    <rect x="365" y="675" width="10" height="88" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="389" y="711">Regola anti-trappola</text>
    <text class="muted small" x="389" y="743">stessa parola, fonte diversa, rimedi diversi, competenza diversa</text>
  </g>
  <g data-safe-box="245 815 1110 54 0" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Prima qualifica il piano: civile, tributario o riscossione. Poi rispondi.</text>
  </g>
</svg>
