    <circle cx="108" cy="500" r="17" fill="#10233F"/>
    <text class="ink label" x="136" y="507">B - Bando</text>
    <text class="muted body" x="96" y="544">civile</text>
<text class="muted body" x="96" y="571">commerciale</text>
  </g>
  <g data-safe-box="370 590 270 132 0" data-safe-name="A - Aree">
    <rect class="softRed" x="370" y="590" width="270" height="132" rx="22"/>
    <circle cx="408" cy="628" r="17" fill="#7A2430"/>
    <text class="ink label" x="436" y="635">A - Aree</text>
    <text class="muted body" x="396" y="672">obbligazioni</text>
<text class="muted body" x="396" y="699">contratti</text>
  </g>
  <g data-safe-box="665 462 270 132 0" data-safe-name="N - Nuclei">
    <rect class="softGold" x="665" y="462" width="270" height="132" rx="22"/>
    <circle cx="703" cy="500" r="17" fill="#D4AF37"/>
    <text class="ink label" x="731" y="507">N - Nuclei</text>
    <text class="muted body" x="691" y="544">impresa</text>
<text class="muted body" x="691" y="571">societa</text>
  </g>
  <g data-safe-box="960 590 270 132 0" data-safe-name="D - Diario">
    <rect class="softGreen" x="960" y="590" width="270" height="132" rx="22"/>
    <circle cx="998" cy="628" r="17" fill="#2F7D5A"/>
    <text class="ink label" x="1026" y="635">D - Diario</text>
    <text class="muted body" x="986" y="672">piani confusi</text>
<text class="muted body" x="986" y="699">crisi generica</text>
  </g>
  <g data-safe-box="1260 462 270 132 0" data-safe-name="O - Output">
    <rect class="softTeal" x="1260" y="462" width="270" height="132" rx="22"/>
    <circle cx="1298" cy="500" r="17" fill="#1F6F78"/>
    <text class="ink label" x="1326" y="507">O - Output</text>
    <text class="muted body" x="1286" y="544">caso</text>
<text class="muted body" x="1286" y="571">checklist</text>
  </g>
  <g data-safe-box="245 815 1110 54 0" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">La materia entra solo dove aiuta a leggere soggetti, rapporti, debiti e documenti.</text>
  </g>
