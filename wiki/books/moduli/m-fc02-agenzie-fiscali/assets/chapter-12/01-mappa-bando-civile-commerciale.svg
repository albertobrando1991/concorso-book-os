  <path class="line" d="M205 370 L1395 370"/>
  <path class="line" d="M205 370 L205 462"/>
  <path class="line" d="M505 370 L505 590"/>
  <path class="line" d="M800 370 L800 462"/>
  <path class="line" d="M1095 370 L1095 590"/>
  <path class="line" d="M1395 370 L1395 462"/>
  <g data-safe-box="70 462 270 132 0" data-safe-name="B - Bando">
