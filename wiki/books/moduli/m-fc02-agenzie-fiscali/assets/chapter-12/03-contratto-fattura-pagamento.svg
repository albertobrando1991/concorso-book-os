<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contratto, fattura e pagamento</title>
  <desc id="desc">Tre piani collegati ma distinti: rapporto, documento, flusso monetario.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Contratto, fattura e pagamento</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Tre piani collegati ma distinti: rapporto, documento, flusso monetario.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="110 305 190 170 0" data-safe-name="Contratto">
    <rect class="softBlue" x="110" y="305" width="190" height="170" rx="22"/>
    <circle cx="146" cy="343" r="21" fill="#10233F"/>
    <text x="146" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">1</text>
    <text class="ink label" x="134" y="387">Contratto</text>
    <text class="muted small" x="134" y="421">rapporto</text>
<text class="muted small" x="134" y="444">operazione</text>
  </g>
  <g data-safe-box="375 305 190 170 0" data-safe-name="Fattura">
    <rect class="softRed" x="375" y="305" width="190" height="170" rx="22"/>
    <circle cx="411" cy="343" r="21" fill="#7A2430"/>
    <text x="411" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">2</text>
    <text class="ink label" x="399" y="387">Fattura</text>
    <text class="muted small" x="399" y="421">documento</text>
<text class="muted small" x="399" y="444">fiscale</text>
  </g>
  <g data-safe-box="640 305 190 170 0" data-safe-name="Pagamento">
    <rect class="softGold" x="640" y="305" width="190" height="170" rx="22"/>
    <circle cx="676" cy="343" r="21" fill="#D4AF37"/>
    <text x="676" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">3</text>
    <text class="ink label" x="664" y="387">Pagamento</text>
    <text class="muted small" x="664" y="421">flusso</text>
<text class="muted small" x="664" y="444">monetario</text>
  </g>
  <g data-safe-box="905 305 190 170 0" data-safe-name="Contabilita">
    <rect class="softGreen" x="905" y="305" width="190" height="170" rx="22"/>
    <circle cx="941" cy="343" r="21" fill="#2F7D5A"/>
    <text x="941" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">4</text>
    <text class="ink label" x="929" y="387">Contabilita</text>
    <text class="muted small" x="929" y="421">ricavi/costi</text>
<text class="muted small" x="929" y="444">crediti/debiti</text>
  </g>
  <g data-safe-box="1170 305 190 170 0" data-safe-name="Fisco">
    <rect class="softTeal" x="1170" y="305" width="190" height="170" rx="22"/>
    <circle cx="1206" cy="343" r="21" fill="#1F6F78"/>
    <text x="1206" y="351" text-anchor="middle" fill="#FFFFFF" style="font: 800 21px 'Segoe UI', Arial, sans-serif">5</text>
    <text class="ink label" x="1194" y="387">Fisco</text>
    <text class="muted small" x="1194" y="421">imposte</text>
<text class="muted small" x="1194" y="444">controlli</text>
  </g>
  <path class="arrowNavy" d="M300 387 L365 387"/>
  <path class="arrowBordeaux" d="M565 387 L630 387"/>
  <path class="arrowGold" d="M830 387 L895 387"/>
  <path class="arrowGreen" d="M1095 387 L1160 387"/>
  <g data-safe-box="260 575 330 106 0" data-safe-name="Errore 1">
    <rect class="softRed" x="260" y="575" width="330" height="106" rx="20"/>
    <rect x="260" y="575" width="10" height="106" rx="5" fill="#7A2430"/>
    <text class="ink label" x="284" y="611">Errore 1</text>
    <text class="muted small" x="284" y="643">fattura =</text>
<text class="muted small" x="284" y="666">contratto completo</text>
  </g>
  <g data-safe-box="635 575 330 106 0" data-safe-name="Errore 2">
    <rect class="softGold" x="635" y="575" width="330" height="106" rx="20"/>
    <rect x="635" y="575" width="10" height="106" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="659" y="611">Errore 2</text>
    <text class="muted small" x="659" y="643">ricavo =</text>
<text class="muted small" x="659" y="666">incasso</text>
  </g>
  <g data-safe-box="1010 575 330 106 0" data-safe-name="Risposta">
    <rect class="softGreen" x="1010" y="575" width="330" height="106" rx="20"/>
    <rect x="1010" y="575" width="10" height="106" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="1034" y="611">Risposta</text>
    <text class="muted small" x="1034" y="643">separa i piani</text>
<text class="muted small" x="1034" y="666">e poi collega</text>
  </g>
  <g data-safe-box="245 815 1110 54 0" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Un caso fiscale ben risolto distingue rapporto, documento, denaro, scrittura e imposta.</text>
  </g>
</svg>
