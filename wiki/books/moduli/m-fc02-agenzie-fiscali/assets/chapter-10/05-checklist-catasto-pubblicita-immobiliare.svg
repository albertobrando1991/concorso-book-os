<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Checklist Catasto e pubblicita immobiliare</title>
  <desc id="desc">Dato, mappa, valore e formalita vanno separati prima di rispondere.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Checklist Catasto e pubblicita immobiliare</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Dato, mappa, valore e formalita vanno separati prima di rispondere.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="130 225 415 88 10" data-safe-name="1. Blocco">
    <rect class="softBlue" x="130" y="225" width="415" height="88" rx="20"/>
    <rect x="130" y="225" width="10" height="88" rx="5" fill="#10233F"/>
    <text class="ink label" x="156" y="260">1. Blocco</text>
    <text class="muted small" x="158" y="289">catasto, OMI o SPI</text>
  </g>
  <g data-safe-box="130 335 415 88 10" data-safe-name="2. Identificativo">
    <rect class="softRed" x="130" y="335" width="415" height="88" rx="20"/>
    <rect x="130" y="335" width="10" height="88" rx="5" fill="#7A2430"/>
    <text class="ink label" x="156" y="370">2. Identificativo</text>
    <text class="muted small" x="158" y="399">Comune foglio particella</text>
  </g>
  <g data-safe-box="130 445 415 88 10" data-safe-name="3. Dato">
    <rect class="softGold" x="130" y="445" width="415" height="88" rx="20"/>
    <rect x="130" y="445" width="10" height="88" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="156" y="480">3. Dato</text>
    <text class="muted small" x="158" y="509">categoria classe rendita</text>
  </g>
  <g data-safe-box="130 555 415 88 10" data-safe-name="4. Servizio">
    <rect class="softGreen" x="130" y="555" width="415" height="88" rx="20"/>
    <rect x="130" y="555" width="10" height="88" rx="5" fill="#2F7D5A"/>
    <text class="ink label" x="156" y="590">4. Servizio</text>
    <text class="muted small" x="158" y="619">visura voltura ispezione</text>
  </g>
  <g data-safe-box="1055 225 415 88 10" data-safe-name="5. Mappa">
    <rect class="softTeal" x="1055" y="225" width="415" height="88" rx="20"/>
    <rect x="1055" y="225" width="10" height="88" rx="5" fill="#1F6F78"/>
    <text class="ink label" x="1081" y="260">5. Mappa</text>
    <text class="muted small" x="1083" y="289">cartografia o planimetria</text>
  </g>
  <g data-safe-box="1055 335 415 88 10" data-safe-name="6. Valore">
    <rect class="softGold" x="1055" y="335" width="415" height="88" rx="20"/>
    <rect x="1055" y="335" width="10" height="88" rx="5" fill="#D4AF37"/>
    <text class="ink label" x="1081" y="370">6. Valore</text>
    <text class="muted small" x="1083" y="399">stima e OMI</text>
  </g>
  <g data-safe-box="1055 445 415 88 10" data-safe-name="7. Formalita">
    <rect class="softRed" x="1055" y="445" width="415" height="88" rx="20"/>
    <rect x="1055" y="445" width="10" height="88" rx="5" fill="#7A2430"/>
    <text class="ink label" x="1081" y="480">7. Formalita</text>
    <text class="muted small" x="1083" y="509">trascrizione iscrizione</text>
  </g>
  <g data-safe-box="1055 555 415 88 10" data-safe-name="8. Cautela">
    <rect class="softBlue" x="1055" y="555" width="415" height="88" rx="20"/>
    <rect x="1055" y="555" width="10" height="88" rx="5" fill="#10233F"/>
    <text class="ink label" x="1081" y="590">8. Cautela</text>
    <text class="muted small" x="1083" y="619">fonti tecniche vigenti</text>
  </g>
  <g data-safe-box="595 335 410 205 8" data-safe-name="Risposta Territorio">
    <rect class="softBlue" x="595" y="335" width="410" height="205" rx="26"/>
    <circle cx="639" cy="379" r="18" fill="#10233F"/>
    <text class="ink label" x="669" y="387">Risposta Territorio</text>
    <text class="muted body" x="629" y="427">dato</text>
<text class="muted body" x="629" y="455">mappa</text>
<text class="muted body" x="629" y="483">valore</text>
<text class="muted body" x="629" y="511">formalita</text>
  </g>
  <path class="arrowGreen" d="M555 410 L585 410"/>
  <path class="arrowTeal" d="M1015 410 L1045 410"/>
  <g data-safe-box="600 585 400 86 8" data-safe-name="Regola d'esame">
    <rect class="softGold" x="600" y="585" width="400" height="86" rx="20"/>
    <text class="ink label" x="624" y="621">Regola d'esame</text>
    <text class="muted small" x="624" y="653">non confondere visura e prova</text>
    <rect x="600" y="585" width="10" height="86" rx="5" fill="#D4AF37"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Prima separa il piano della domanda, poi cita servizio, limite e fonte da verificare.</text>
  </g>

</svg>
