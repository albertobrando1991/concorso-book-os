<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sistema Territorio Agenzia Entrate</title>
  <desc id="desc">Identificare, rappresentare, valutare e rendere conoscibili le vicende immobiliari.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Sistema Territorio Agenzia Entrate</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Identificare, rappresentare, valutare e rendere conoscibili le vicende immobiliari.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="555 218 490 138 8" data-safe-name="Sistema Territorio AE">
    <rect class="softBlue" x="555" y="218" width="490" height="138" rx="26"/>
    <circle cx="599" cy="262" r="18" fill="#10233F"/>
    <text class="ink label" x="629" y="270">Sistema Territorio AE</text>
    <text class="muted body" x="589" y="310">banche dati, servizi</text>
<text class="muted body" x="589" y="338">utenti e professionisti</text>
  </g>
  <path class="line" d="M800 356 L800 408"/>
  <path class="line" d="M280 408 L1320 408"/>
  <path class="line" d="M280 408 L280 500"/>
  <path class="line" d="M540 408 L540 500"/>
  <path class="line" d="M800 408 L800 500"/>
  <path class="line" d="M1060 408 L1060 500"/>
  <path class="line" d="M1320 408 L1320 500"/>
  <g data-safe-box="110 500 290 150 12" data-safe-name="Catasto">
    <rect class="softBlue" x="110" y="500" width="290" height="150" rx="24"/>
    <text class="ink label" x="140" y="546">Catasto</text>
    <rect x="140" y="568" width="230" height="4" rx="2" fill="#10233F"/>
    <text class="muted body" x="142" y="605">identifica</text>
<text class="muted body" x="142" y="632">classifica</text>
  </g>
  <g data-safe-box="455 500 290 150 12" data-safe-name="Cartografia">
    <rect class="softRed" x="455" y="500" width="290" height="150" rx="24"/>
    <text class="ink label" x="485" y="546">Cartografia</text>
    <rect x="485" y="568" width="230" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="487" y="605">rappresenta</text>
<text class="muted body" x="487" y="632">particelle</text>
  </g>
  <g data-safe-box="800 500 290 150 12" data-safe-name="Estimo / OMI">
    <rect class="softGold" x="800" y="500" width="290" height="150" rx="24"/>
    <text class="ink label" x="830" y="546">Estimo / OMI</text>
    <rect x="830" y="568" width="230" height="4" rx="2" fill="#D4AF37"/>
    <text class="muted body" x="832" y="605">valuta</text>
<text class="muted body" x="832" y="632">osserva mercato</text>
  </g>
  <g data-safe-box="1145 500 290 150 12" data-safe-name="Pubblicita">
    <rect class="softTeal" x="1145" y="500" width="290" height="150" rx="24"/>
    <text class="ink label" x="1175" y="546">Pubblicita</text>
    <rect x="1175" y="568" width="230" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="1177" y="605">registri</text>
<text class="muted body" x="1177" y="632">formalita</text>
  </g>
  <g data-safe-box="520 695 560 82 8" data-safe-name="Regola anti-confusione">
    <rect class="softGreen" x="520" y="695" width="560" height="82" rx="20"/>
    <text class="ink label" x="544" y="731">Regola anti-confusione</text>
    <text class="muted small" x="544" y="763">i quattro piani dialogano, ma non coincidono</text>
    <rect x="520" y="695" width="10" height="82" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Il candidato deve classificare la domanda prima di scegliere servizio o banca dati.</text>
  </g>

</svg>
