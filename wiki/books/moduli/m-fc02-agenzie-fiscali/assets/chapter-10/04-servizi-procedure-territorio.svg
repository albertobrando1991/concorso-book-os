<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Servizi e procedure del Territorio</title>
  <desc id="desc">Visura, planimetria, voltura, rettifica, cartografia, ispezione e OMI.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 0; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <g data-safe-box="120 14 1360 116 0" data-safe-name="header">
    <text class="ink title" x="800" y="68" text-anchor="middle">Servizi e procedure del Territorio</text>
    <text class="muted subtitle" x="800" y="106" text-anchor="middle">Visura, planimetria, voltura, rettifica, cartografia, ispezione e OMI.</text>
  </g>
  
  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="560 220 480 138 8" data-safe-name="Domanda dell'utente">
    <rect class="softBlue" x="560" y="220" width="480" height="138" rx="26"/>
    <circle cx="604" cy="264" r="18" fill="#10233F"/>
    <text class="ink label" x="634" y="272">Domanda dell'utente</text>
    <text class="muted body" x="594" y="312">consultare, aggiornare</text>
<text class="muted body" x="594" y="340">verificare o stimare</text>
  </g>
  <path class="arrowNavy" d="M800 358 L800 420"/>
  <g data-safe-box="105 460 360 155 12" data-safe-name="Visura">
    <rect class="softBlue" x="105" y="460" width="360" height="155" rx="24"/>
    <text class="ink label" x="135" y="506">Visura</text>
    <rect x="135" y="528" width="300" height="4" rx="2" fill="#10233F"/>
    <text class="muted body" x="137" y="565">dati catastali</text>
<text class="muted body" x="137" y="592">immobile o soggetto</text>
  </g>
  <g data-safe-box="450 460 360 155 12" data-safe-name="Planimetria">
    <rect class="softRed" x="450" y="460" width="360" height="155" rx="24"/>
    <text class="ink label" x="480" y="506">Planimetria</text>
    <rect x="480" y="528" width="300" height="4" rx="2" fill="#7A2430"/>
    <text class="muted body" x="482" y="565">unita urbana</text>
<text class="muted body" x="482" y="592">rappresentazione</text>
  </g>
  <g data-safe-box="795 460 360 155 12" data-safe-name="Voltura">
    <rect class="softGold" x="795" y="460" width="360" height="155" rx="24"/>
    <text class="ink label" x="825" y="506">Voltura</text>
    <rect x="825" y="528" width="300" height="4" rx="2" fill="#D4AF37"/>
    <text class="muted body" x="827" y="565">intestazioni</text>
<text class="muted body" x="827" y="592">catastali</text>
  </g>
  <g data-safe-box="1140 460 360 155 12" data-safe-name="Ispezione">
    <rect class="softTeal" x="1140" y="460" width="360" height="155" rx="24"/>
    <text class="ink label" x="1170" y="506">Ispezione</text>
    <rect x="1170" y="528" width="300" height="4" rx="2" fill="#1F6F78"/>
    <text class="muted body" x="1172" y="565">registri</text>
<text class="muted body" x="1172" y="592">formalita</text>
  </g>
  <g data-safe-box="280 660 315 92 8" data-safe-name="Rettifica">
    <rect class="softGreen" x="280" y="660" width="315" height="92" rx="20"/>
    <text class="ink label" x="304" y="696">Rettifica</text>
    <text class="muted small" x="304" y="728">corregge dati non coerenti</text>
    <rect x="280" y="660" width="10" height="92" rx="5" fill="#2F7D5A"/>
  </g>
  <g data-safe-box="645 660 315 92 8" data-safe-name="Cartografia">
    <rect class="softRed" x="645" y="660" width="315" height="92" rx="20"/>
    <text class="ink label" x="669" y="696">Cartografia</text>
    <text class="muted small" x="669" y="728">mappe e particelle</text>
    <rect x="645" y="660" width="10" height="92" rx="5" fill="#7A2430"/>
  </g>
  <g data-safe-box="1010 660 315 92 8" data-safe-name="OMI">
    <rect class="softGold" x="1010" y="660" width="315" height="92" rx="20"/>
    <text class="ink label" x="1034" y="696">OMI</text>
    <text class="muted small" x="1034" y="728">quotazioni di supporto</text>
    <rect x="1010" y="660" width="10" height="92" rx="5" fill="#D4AF37"/>
  </g>
  <g data-safe-box="245 815 1110 54 14" data-safe-name="nota">
    <rect class="note" x="245" y="815" width="1110" height="54" rx="18"/>
    <text class="ink body" x="800" y="850" text-anchor="middle">Ogni servizio risponde a una domanda diversa: dato, disegno, intestazione, registri o mercato.</text>
  </g>

</svg>
