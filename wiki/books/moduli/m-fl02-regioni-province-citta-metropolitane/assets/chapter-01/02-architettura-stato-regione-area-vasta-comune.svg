<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architettura territoriale multilivello</title>
  <desc id="desc">Stato, Regione, area vasta e Comune non sono una gerarchia semplice.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; }
      .navy { fill: #10233F; }
      .bordeaux { fill: #7A2430; }
      .gold { fill: #D4AF37; }
      .green { fill: #2F7D5A; }
      .teal { fill: #1F6F78; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .thin { stroke: #CBD5E1; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="ink title" x="800" y="68" text-anchor="middle">Architettura territoriale multilivello</text>
  <text class="muted subtitle" x="800" y="108" text-anchor="middle">Stato, Regione, area vasta e Comune non sono una gerarchia semplice.</text>

  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="155 230 1290 94 10">
    <rect class="softBlue" x="155" y="230" width="1290" height="94" rx="24"/>
    <rect x="155" y="230" width="12" height="94" rx="6" fill="#10233F"/>
    <text class="navy label" x="201" y="269" text-anchor="start" style="font-size:24px">Stato</text>
    <text class="ink body" x="410" y="266" text-anchor="start" style="font-weight:800;font-size:19px">unita dell'ordinamento</text>
    <text class="muted small" x="410" y="295" text-anchor="start" style="font-size:18px">principi, livelli essenziali, cornice nazionale</text>
  </g>
  <g data-safe-box="210 350 1180 94 10">
    <rect class="softRed" x="210" y="350" width="1180" height="94" rx="24"/>
    <rect x="210" y="350" width="12" height="94" rx="6" fill="#7A2430"/>
    <text class="bordeaux label" x="256" y="389" text-anchor="start" style="font-size:24px">Regione</text>
    <text class="ink body" x="465" y="386" text-anchor="start" style="font-weight:800;font-size:19px">legislazione, programmazione, coordinamento</text>
    <text class="muted small" x="465" y="415" text-anchor="start" style="font-size:18px">finanziamenti, atti, controlli</text>
  </g>
  <g data-safe-box="265 470 1070 94 10">
    <rect class="softGold" x="265" y="470" width="1070" height="94" rx="24"/>
    <rect x="265" y="470" width="12" height="94" rx="6" fill="#D4AF37"/>
    <text class="gold label" x="311" y="509" text-anchor="start" style="font-size:24px">Area vasta</text>
    <text class="ink body" x="520" y="506" text-anchor="start" style="font-weight:800;font-size:19px">Province e Citta metropolitane</text>
    <text class="muted small" x="520" y="535" text-anchor="start" style="font-size:18px">viabilita, scuole, pianificazione, rete territoriale</text>
  </g>
  <g data-safe-box="320 590 960 94 10">
    <rect class="softGreen" x="320" y="590" width="960" height="94" rx="24"/>
    <rect x="320" y="590" width="12" height="94" rx="6" fill="#2F7D5A"/>
    <text class="green label" x="366" y="629" text-anchor="start" style="font-size:24px">Comune</text>
    <text class="ink body" x="575" y="626" text-anchor="start" style="font-weight:800;font-size:19px">prossimita, sportello, servizi</text>
    <text class="muted small" x="575" y="655" text-anchor="start" style="font-size:18px">attuazione locale e rapporto con cittadini e imprese</text>
  </g>
  <g data-safe-box="260 815 1080 62 10">
    <rect class="note" x="260" y="815" width="1080" height="62" rx="24"/>
    <text class="ink body" x="800" y="854" text-anchor="middle" style="font-weight:800;font-size:20px">Autonomia e coordinamento: il rapporto istituzionale non e una scala gerarchica lineare.</text>
  </g>

</svg>
