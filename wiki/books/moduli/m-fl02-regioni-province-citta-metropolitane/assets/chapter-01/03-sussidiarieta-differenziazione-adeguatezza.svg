<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tre principi per allocare le funzioni</title>
  <desc id="desc">Sussidiarieta, differenziazione e adeguatezza decidono la scala.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; }
      .navy { fill: #10233F; }
      .bordeaux { fill: #7A2430; }
      .gold { fill: #D4AF37; }
      .green { fill: #2F7D5A; }
      .teal { fill: #1F6F78; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .thin { stroke: #CBD5E1; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="ink title" x="800" y="68" text-anchor="middle">Tre principi per allocare le funzioni</text>
  <text class="muted subtitle" x="800" y="108" text-anchor="middle">Sussidiarieta, differenziazione e adeguatezza decidono la scala.</text>

  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="120 245 365 330 10">
    <rect class="softBlue" x="120" y="245" width="365" height="330" rx="28"/>
    <rect x="120" y="245" width="365" height="12" rx="6" fill="#10233F"/>
    <text class="navy label" x="302.5" y="302" text-anchor="middle" style="font-size:24px">Sussidiarieta</text>
    <text class="ink small" x="302.5" y="341" text-anchor="middle" style="font-weight:800;font-size:18px">Vicino, se efficace</text>
    <path class="thin" d="M175 371 L430 371"/>
    <circle cx="190" cy="413" r="6" fill="#D4AF37"/><text class="ink body" x="212" y="420" style="font-size:18px">livello piu prossimo</text>
<circle cx="190" cy="456" r="6" fill="#D4AF37"/><text class="ink body" x="212" y="463" style="font-size:18px">servizio al cittadino</text>
<circle cx="190" cy="499" r="6" fill="#D4AF37"/><text class="ink body" x="212" y="506" style="font-size:18px">ma senza automatismi</text>
  </g>
  <g data-safe-box="555 245 365 330 10">
    <rect class="softRed" x="555" y="245" width="365" height="330" rx="28"/>
    <rect x="555" y="245" width="365" height="12" rx="6" fill="#7A2430"/>
    <text class="bordeaux label" x="737.5" y="302" text-anchor="middle" style="font-size:24px">Differenziazione</text>
    <text class="ink small" x="737.5" y="341" text-anchor="middle" style="font-weight:800;font-size:18px">Territori diversi</text>
    <path class="thin" d="M610 371 L865 371"/>
    <circle cx="625" cy="413" r="6" fill="#D4AF37"/><text class="ink body" x="647" y="420" style="font-size:18px">piccoli Comuni</text>
<circle cx="625" cy="456" r="6" fill="#D4AF37"/><text class="ink body" x="647" y="463" style="font-size:18px">aree metropolitane</text>
<circle cx="625" cy="499" r="6" fill="#D4AF37"/><text class="ink body" x="647" y="506" style="font-size:18px">zone interne</text>
  </g>
  <g data-safe-box="990 245 365 330 10">
    <rect class="softGreen" x="990" y="245" width="365" height="330" rx="28"/>
    <rect x="990" y="245" width="365" height="12" rx="6" fill="#2F7D5A"/>
    <text class="green label" x="1172.5" y="302" text-anchor="middle" style="font-size:24px">Adeguatezza</text>
    <text class="ink small" x="1172.5" y="341" text-anchor="middle" style="font-weight:800;font-size:18px">Scala e mezzi</text>
    <path class="thin" d="M1045 371 L1300 371"/>
    <circle cx="1060" cy="413" r="6" fill="#D4AF37"/><text class="ink body" x="1082" y="420" style="font-size:18px">competenze</text>
<circle cx="1060" cy="456" r="6" fill="#D4AF37"/><text class="ink body" x="1082" y="463" style="font-size:18px">risorse</text>
<circle cx="1060" cy="499" r="6" fill="#D4AF37"/><text class="ink body" x="1082" y="506" style="font-size:18px">coordinamento</text>
  </g>
  <path class="arrowGold" d="M800 585 L800 665"/>
  <g data-safe-box="410 665 780 110 10">
    <rect class="softGold" x="410" y="665" width="780" height="110" rx="26"/>
    <rect x="410" y="665" width="780" height="10" rx="5" fill="#D4AF37"/>
    <text class="gold label" x="800" y="705" text-anchor="middle" style="font-size:22px">Funzione allocata al livello coerente</text>
    <text class="muted small" x="800" y="737" text-anchor="middle" style="font-size:17px">Comune, Regione, Provincia o Citta metropolitana</text>
<text class="muted small" x="800" y="761" text-anchor="middle" style="font-size:17px">in base a problema, territorio e capacita amministrativa</text>
  </g>
  <g data-safe-box="245 815 1110 62 10">
    <rect class="note" x="245" y="815" width="1110" height="62" rx="24"/>
    <text class="ink body" x="800" y="854" text-anchor="middle" style="font-weight:800;font-size:20px">In prova non basta definire i principi: devi usarli per scegliere la scala della funzione.</text>
  </g>

</svg>
