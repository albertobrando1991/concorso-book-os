<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Catena di un avviso regionale</title>
  <desc id="desc">Programma, avviso, beneficiario, attuazione, rendicontazione e monitoraggio.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .softBlue { fill: #EAF2FB; stroke: #B9CBE0; stroke-width: 2.5; }
      .softRed { fill: #F8E8EA; stroke: #E3B9BF; stroke-width: 2.5; }
      .softGold { fill: #FFF4CC; stroke: #E8D080; stroke-width: 2.5; }
      .softGreen { fill: #E7F3ED; stroke: #A8D1BD; stroke-width: 2.5; }
      .softTeal { fill: #E4F4F5; stroke: #A3D5D8; stroke-width: 2.5; }
      .note { fill: #FFF7ED; stroke: #E7C18E; stroke-width: 2.5; }
      .ink { fill: #0F172A; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .muted { fill: #526174; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 43px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 22px; }
      .label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0; }
      .body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 20px; }
      .small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-size: 18px; }
      .navy { fill: #10233F; }
      .bordeaux { fill: #7A2430; }
      .gold { fill: #D4AF37; }
      .green { fill: #2F7D5A; }
      .teal { fill: #1F6F78; }
      .line { stroke: #94A3B8; stroke-width: 4; stroke-linecap: round; fill: none; }
      .thin { stroke: #CBD5E1; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrowNavy { stroke: #10233F; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowNavy); }
      .arrowBordeaux { stroke: #7A2430; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowBordeaux); }
      .arrowGold { stroke: #D4AF37; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGold); }
      .arrowGreen { stroke: #2F7D5A; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowGreen); }
      .arrowTeal { stroke: #1F6F78; stroke-width: 5; stroke-linecap: round; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10233F"/></marker>
    <marker id="arrowBordeaux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A2430"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D5A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F78"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="ink title" x="800" y="68" text-anchor="middle">Catena di un avviso regionale</text>
  <text class="muted subtitle" x="800" y="108" text-anchor="middle">Programma, avviso, beneficiario, attuazione, rendicontazione e monitoraggio.</text>

  <rect class="card" x="70" y="160" width="1460" height="640" rx="30"/>
  <g data-safe-box="100 255 185 160 10">
    <rect class="softBlue" x="100" y="255" width="185" height="160" rx="24"/>
    <circle cx="142" cy="299" r="25" fill="#10233F"/>
    <text x="142" y="308" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">1</text>
    <text class="navy label" x="192" y="303" text-anchor="middle" style="font-size:17px">Programma</text>
    <text class="muted small" x="192" y="347" text-anchor="middle" style="font-size:17px">obiettivi</text>
<text class="muted small" x="192" y="375" text-anchor="middle" style="font-size:17px">risorse</text>
  </g>
  <path class="arrowNavy" d="M285 335 L365 335"/>
  <g data-safe-box="390 255 185 160 10">
    <rect class="softRed" x="390" y="255" width="185" height="160" rx="24"/>
    <circle cx="432" cy="299" r="25" fill="#7A2430"/>
    <text x="432" y="308" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">2</text>
    <text class="bordeaux label" x="482" y="303" text-anchor="middle" style="font-size:17px">Avviso</text>
    <text class="muted small" x="482" y="347" text-anchor="middle" style="font-size:17px">requisiti</text>
<text class="muted small" x="482" y="375" text-anchor="middle" style="font-size:17px">criteri</text>
  </g>
  <path class="arrowBordeaux" d="M575 335 L655 335"/>
  <g data-safe-box="680 255 185 160 10">
    <rect class="softGold" x="680" y="255" width="185" height="160" rx="24"/>
    <circle cx="722" cy="299" r="25" fill="#D4AF37"/>
    <text x="722" y="308" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">3</text>
    <text class="gold label" x="772" y="303" text-anchor="middle" style="font-size:17px">Domanda</text>
    <text class="muted small" x="772" y="347" text-anchor="middle" style="font-size:17px">Comune</text>
<text class="muted small" x="772" y="375" text-anchor="middle" style="font-size:17px">progetto</text>
  </g>
  <path class="arrowGold" d="M865 335 L945 335"/>
  <g data-safe-box="970 255 185 160 10">
    <rect class="softGreen" x="970" y="255" width="185" height="160" rx="24"/>
    <circle cx="1012" cy="299" r="25" fill="#2F7D5A"/>
    <text x="1012" y="308" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">4</text>
    <text class="green label" x="1062" y="303" text-anchor="middle" style="font-size:17px">Istruttoria</text>
    <text class="muted small" x="1062" y="347" text-anchor="middle" style="font-size:17px">ammissibile</text>
<text class="muted small" x="1062" y="375" text-anchor="middle" style="font-size:17px">graduatoria</text>
  </g>
  <path class="arrowGreen" d="M1155 335 L1235 335"/>
  <g data-safe-box="1260 255 185 160 10">
    <rect class="softTeal" x="1260" y="255" width="185" height="160" rx="24"/>
    <circle cx="1302" cy="299" r="25" fill="#1F6F78"/>
    <text x="1302" y="308" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">5</text>
    <text class="teal label" x="1352" y="303" text-anchor="middle" style="font-size:17px">Concessione</text>
    <text class="muted small" x="1352" y="347" text-anchor="middle" style="font-size:17px">atto</text>
<text class="muted small" x="1352" y="375" text-anchor="middle" style="font-size:17px">obblighi</text>
  </g>
  <path class="line" d="M1360 455 C1360 540 240 540 240 625"/>
  <g data-safe-box="100 625 185 160 10">
    <rect class="softBlue" x="100" y="625" width="185" height="160" rx="24"/>
    <circle cx="142" cy="669" r="25" fill="#10233F"/>
    <text x="142" y="678" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">6</text>
    <text class="navy label" x="192" y="673" text-anchor="middle" style="font-size:17px">Attuazione</text>
    <text class="muted small" x="192" y="717" text-anchor="middle" style="font-size:17px">affidamenti</text>
<text class="muted small" x="192" y="745" text-anchor="middle" style="font-size:17px">spesa</text>
  </g>
  <path class="arrowNavy" d="M285 705 L420 705"/>
  <g data-safe-box="445 625 710 110 10">
    <rect class="softRed" x="445" y="625" width="710" height="110" rx="26"/>
    <rect x="445" y="625" width="710" height="10" rx="5" fill="#7A2430"/>
    <text class="bordeaux label" x="800" y="665" text-anchor="middle" style="font-size:22px">Rendicontazione e controllo</text>
    <text class="muted small" x="800" y="697" text-anchor="middle" style="font-size:17px">documenti, pagamenti, tracciabilita</text>
<text class="muted small" x="800" y="721" text-anchor="middle" style="font-size:17px">revoca o recupero se emergono irregolarita</text>
  </g>
  <path class="arrowBordeaux" d="M1180 705 L1315 705"/>
  <g data-safe-box="1340 625 185 160 10">
    <rect class="softGreen" x="1340" y="625" width="185" height="160" rx="24"/>
    <circle cx="1382" cy="669" r="25" fill="#2F7D5A"/>
    <text x="1382" y="678" text-anchor="middle" style="fill:#fff;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:24px;font-weight:900">7</text>
    <text class="green label" x="1432" y="673" text-anchor="middle" style="font-size:17px">Monitoraggio</text>
    <text class="muted small" x="1432" y="717" text-anchor="middle" style="font-size:17px">dati</text>
<text class="muted small" x="1432" y="745" text-anchor="middle" style="font-size:17px">indicatori</text>
  </g>

</svg>
